<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="WorthIt: money lessons for kids.">
<title>WorthIt</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0C0A07">
<style>
  @font-face { font-family: "WorthIt Outfit"; src: url("outfit.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "WorthIt Manrope"; src: url("manrope.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "WorthIt Mono"; src: url("jetbrains-mono.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg: #0B0907; --raise: #14110D; --line: rgba(228,176,74,.16); --line2: rgba(228,176,74,.32);
    --text: #F6F1E7; --mute: #A39887; --faint: #7F7568; --gold: #E4B04A; --gold-hi: #F3D27A; --gold-lo: #C9953B; --green: #8FD1A6;
    --display: "WorthIt Outfit", "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "WorthIt Manrope", "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "WorthIt Mono", "JetBrains Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  .gold-text { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- the entrance: the logo, huge, and one button ---------- */
  .intro { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 4vh, 48px);
    padding: 24px 16px; background: radial-gradient(70% 60% at 50% 45%, #241B0F 0%, #100C08 55%, var(--bg) 100%); overflow: hidden; }
  .intro::before { content: ""; position: absolute; left: 50%; top: 46%; width: min(80vw, 900px); height: min(50vw, 560px); transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(228,176,74,.22), transparent); opacity: .7; pointer-events: none; will-change: opacity, transform; }
  .intro .logo { width: min(92vw, 1000px, 92vh); height: auto; position: relative; z-index: 1; filter: drop-shadow(0 20px 60px rgba(228,176,74,.25)); }
  .dust i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--gold-hi); opacity: .2; box-shadow: 0 0 8px var(--gold); }
  .enter { position: relative; z-index: 1; border: 0; cursor: pointer; border-radius: 999px; padding: 17px 54px; display: inline-flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); color: #17120A; font: 700 clamp(17px, 2.2vw, 20px) var(--display); letter-spacing: .04em;
    box-shadow: 0 16px 44px rgba(228,176,74,.32), inset 0 1px 0 rgba(255,255,255,.55); transition: transform .3s var(--ease), filter .3s; }
  .enter:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .enter:active { transform: scale(.98); }
  .enter:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 6px; }
  .enter svg { width: 20px; height: 20px; transition: transform .3s var(--ease); }
  .enter:hover svg { transform: translateX(4px); }

  /* ---------- the app: only the extension ---------- */
  .app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: radial-gradient(70% 55% at 50% 0%, #1A140C 0%, var(--bg) 70%); }
  .dev { position: relative; flex: 0 1 440px; min-width: 0; width: 100%; max-width: 440px; height: min(880px, calc(100dvh - 48px)); background: var(--bg); border: 1px solid var(--line); border-radius: 30px; overflow: hidden;
    box-shadow: 0 50px 120px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(0,0,0,.6), 0 0 80px -20px rgba(228,176,74,.12); }
  @media (max-width: 520px) { .app { padding: 0; } .dev { max-width: none; height: 100%; border: 0; border-radius: 0; box-shadow: none; } }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .scr.leaving { pointer-events: none; z-index: 1; }
  .scr:not(.leaving) { z-index: 2; }
  .ph { position: absolute; inset: 0; }

  /* ---------- presenter rail: jump between the steps, and what the real WorthIt does at each one ---------- */
  .app { gap: 34px; }
  .rail { flex: 0 0 258px; max-height: min(880px, calc(100dvh - 48px)); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(180deg, rgba(228,176,74,.05), rgba(255,255,255,.01)); }
  .rk { font: 600 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--gold-hi); }
  .rh b { display: block; font: 700 18px var(--display); margin-top: 3px; letter-spacing: -.01em; }
  .rs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .rs button { width: 100%; display: flex; gap: 11px; align-items: flex-start; text-align: left; border: 0; background: transparent; color: var(--mute); padding: 8px 9px; border-radius: 12px; cursor: pointer; transition: background .25s, color .25s; }
  .rs button:hover { background: rgba(228,176,74,.07); color: var(--text); }
  .rs button i { flex: 0 0 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--mono); font-style: normal; border: 1px solid var(--line2); color: var(--gold-hi); margin-top: 1px; }
  .rs button span { display: flex; flex-direction: column; font: 600 14px var(--display); }
  .rs button small { font: 500 11.5px var(--body); color: var(--faint); margin-top: 1px; }
  .rs button.on { background: linear-gradient(180deg, rgba(228,176,74,.16), rgba(228,176,74,.05)); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
  .rs button.on i { background: linear-gradient(180deg, #F5D686, var(--gold)); color: #17120A; border-color: transparent; }
  .rs button.done i { background: rgba(228,176,74,.18); }
  .rnote { border-radius: 14px; padding: 12px 13px; background: rgba(143,209,166,.06); border: 1px solid rgba(143,209,166,.22); }
  .rnote .rk { color: var(--green); }
  .rnote p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--text); }
  .rnav { display: flex; gap: 8px; }
  .rnav button { flex: 1; border-radius: 999px; padding: 10px 12px; font: 700 13.5px var(--display); cursor: pointer; border: 1px solid var(--line2); background: transparent; color: var(--text); }
  .rnav button.nx { border: 0; background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); color: #17120A; }
  .rnav button:disabled { opacity: .35; cursor: default; }
  .rtm .seg { margin: 7px 0 0; width: 100%; box-sizing: border-box; }
  .rtm .seg button { flex: 1; padding: 7px 8px; font-size: 12.5px; }
  .rcur { display: none; }
  @media (max-width: 900px) {
    .app { flex-direction: column; justify-content: flex-start; align-items: center; gap: 10px; padding: 10px 16px 16px; }
    .rail { flex: 0 0 auto; width: 100%; max-width: 440px; box-sizing: border-box; max-height: none; overflow: visible; flex-direction: row; align-items: center; gap: 8px; padding: 6px; border-radius: 999px; }
    .rh, .rs, .rnote, .rtm { display: none; }
    .rcur { display: block; flex: 1; min-width: 0; text-align: center; font: 600 13px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rnav { display: contents; }
    .rnav button { flex: 0 0 auto; padding: 8px 14px; }
    .dev { flex: 0 0 auto; height: calc(100dvh - 78px); }
  }
  @media (max-width: 520px) { .app { padding: 6px 0 0; gap: 6px; } .rail { width: calc(100% - 16px); } .dev { height: calc(100dvh - 58px); } }
  .realnote { margin: 12px 0 0; font-size: 11.5px; line-height: 1.55; color: var(--mute); text-align: left; border-left: 2px solid var(--green); padding: 4px 0 4px 10px; max-width: 340px; }
  .realnote b { color: var(--green); font-weight: 700; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; flex: 0 0 auto; position: relative; z-index: 2; }
  .bar h1 { margin: 0; font: 600 17px var(--display); letter-spacing: .01em; }
  .bar .sp { flex: 1; }
  .ico { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--mute); display: grid; place-items: center; cursor: pointer; transition: color .2s, border-color .2s, transform .3s var(--ease); }
  .ico:hover { color: var(--gold-hi); border-color: var(--line2); }
  .ico svg { width: 17px; height: 17px; }
  .body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 90px; display: flex; flex-direction: column; align-items: center; }

  /* launch page: the WorthIt start screen, refined */
  .home .body { justify-content: center; padding-top: 0; text-align: center; gap: 0; }
  .sky { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(80% 50% at 50% 30%, rgba(228,176,74,.12), transparent 70%); }
  .home .mark { width: 128px; height: auto; filter: drop-shadow(0 14px 34px rgba(228,176,74,.35)); }
  .home h2 { margin: 6px 0 0; font: 800 38px var(--display); letter-spacing: -.035em; }
  .home .hi { margin: 4px 0 0; font: 500 19px var(--display); color: var(--text); }
  .rank { display: flex; flex-direction: column; align-items: center; gap: 7px; margin: 16px 0 0; }
  .rank .rl { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-hi);
    border: 1px solid var(--line2); border-radius: 999px; padding: 6px 14px; background: linear-gradient(180deg, rgba(228,176,74,.12), rgba(228,176,74,.03)); }
  .rank .rb { width: 170px; height: 3px; border-radius: 99px; background: rgba(228,176,74,.14); overflow: hidden; }
  .rank .rb i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); border-radius: 99px; }
  .rank .rn { font-size: 11.5px; color: var(--faint); letter-spacing: .02em; }
  .planchip { margin: 12px 0 0; border: 1px solid var(--line2); background: rgba(228,176,74,.06); color: var(--gold-hi); border-radius: 999px; padding: 6px 14px; font: 600 12px var(--display); cursor: pointer; }
  .planchip.paid { color: #17120A; background: linear-gradient(180deg, #F5D686, var(--gold)); border: 0; }
  .planchip.ended { color: var(--mute); }
  .tagline { margin: 16px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--mute); max-width: 30ch; }
  .choices { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 310px; }
  .pill { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; border-radius: 999px; padding: 14px 22px; cursor: pointer; transition: transform .3s var(--ease), box-shadow .3s, border-color .3s, filter .3s; }
  .pill .lt { font: 700 17px var(--display); letter-spacing: .01em; }
  .pill .ls { font: 500 11.5px var(--body); opacity: .72; }
  .pill.gold { border: 0; color: #17120A; background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); box-shadow: 0 14px 38px rgba(228,176,74,.3), inset 0 1px 0 rgba(255,255,255,.55); }
  .pill.dark { border: 1px solid var(--line2); color: var(--text); background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)); }
  .pill:hover { transform: translateY(-2px); }
  .pill.gold:hover { filter: brightness(1.05); box-shadow: 0 18px 44px rgba(228,176,74,.4), inset 0 1px 0 rgba(255,255,255,.55); }
  .pill.dark:hover { border-color: var(--gold); box-shadow: 0 10px 30px rgba(228,176,74,.12); }
  .pill:active { transform: scale(.98); }
  .minirow { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 18px; }
  .link { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--faint); font: 500 12.5px var(--body); cursor: pointer; padding: 6px 2px; transition: color .2s; }
  .link:hover { color: var(--gold-hi); }
  .link svg { width: 13px; height: 13px; }

  .hp { width: 112px; height: 112px; flex: 0 0 auto; }
  .bub { position: relative; max-width: 340px; background: linear-gradient(180deg, #1C1712, #141009); border: 1px solid var(--line2); border-radius: 18px; padding: 12px 18px; text-align: center;
    font: 500 16px/1.45 var(--display); margin: 10px 0 18px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .bub::before { content: ""; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; margin-left: -6px; background: #1C1712; border-left: 1px solid var(--line2); border-top: 1px solid var(--line2); transform: rotate(45deg); }
  .bub b { color: var(--gold-hi); font-weight: 600; }

  .form { width: 100%; max-width: 360px; display: grid; gap: 10px; }
  input.in, select.in { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.02); border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 14px 16px; font: 500 16px var(--display); transition: border-color .2s, box-shadow .2s; }
  input.in:focus, select.in:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(228,176,74,.12); }
  .money { position: relative; }
  .money .cur { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gold-hi); font: 600 16px var(--display); pointer-events: none; }
  .money .in { padding-left: 50px; }
  .btn { border: 0; border-radius: 999px; padding: 15px; font: 700 16px var(--display); letter-spacing: .02em; cursor: pointer; color: #17120A; background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo));
    box-shadow: 0 12px 32px rgba(228,176,74,.28), inset 0 1px 0 rgba(255,255,255,.55); transition: transform .3s var(--ease), filter .3s, opacity .3s; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
  .btn:disabled { opacity: .3; cursor: default; box-shadow: none; }
  .btn.ghost { background: rgba(255,255,255,.02); color: var(--text); border: 1px solid var(--line2); box-shadow: none; font-weight: 600; font-size: 14px; padding: 13px; }
  .btn.ghost:hover { border-color: var(--gold); }
  .btn.warn { color: #E9A38F; border-color: rgba(233,163,143,.35); }
  .klbl { font: 600 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 22px auto 10px; width: 100%; max-width: 360px; }
  .tries { width: 100%; max-width: 360px; display: grid; gap: 8px; }
  .try { display: flex; align-items: center; gap: 12px; text-align: left; background: rgba(255,255,255,.02); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 10px 14px; cursor: pointer; font-family: inherit; transition: border-color .25s, transform .3s var(--ease), background .25s; }
  .try:hover { border-color: var(--line2); background: rgba(228,176,74,.04); transform: translateX(3px); }
  .try .e { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: radial-gradient(circle at 35% 30%, rgba(243,210,122,.22), rgba(228,176,74,.05)); border: 1px solid var(--line); flex: 0 0 auto; }
  .try b { flex: 1; font: 600 14px var(--body); }
  .try span.p { font: 600 14px var(--display); color: var(--gold-hi); }

  .fields { width: 100%; max-width: 380px; display: grid; gap: 12px; }
  .fld { display: grid; gap: 6px; font-size: 12.5px; color: var(--mute); }
  .fld em { font-style: normal; color: var(--faint); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }
  select.in { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  .fld .in { font-size: 15px; padding: 11px 13px; }
  .card { width: 100%; max-width: 380px; background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-sizing: border-box; margin-bottom: 12px; }
  .card h2 { margin: 0 0 4px; font: 600 16px var(--display); }
  .card p { margin: 0 0 12px; font-size: 12.5px; color: var(--mute); line-height: 1.5; }
  .ok { color: var(--green); font-weight: 700; font-size: 13px; min-height: 18px; text-align: center; }
  .fine { font-size: 11.5px; color: var(--faint); text-align: center; line-height: 1.6; max-width: 360px; }
  .fine a { color: var(--mute); }
  .flash { box-shadow: 0 0 0 3px var(--gold) !important; }

  /* Penny's chat slides up as a sheet */
  .shade { position: absolute; inset: 0; z-index: 19; background: rgba(5,4,3,.68); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 84%; z-index: 20; background: linear-gradient(180deg, #16120D, #0E0B08); border-top: 1px solid var(--line2); border-radius: 28px 28px 0 0; padding: 24px 16px 16px; display: flex; flex-direction: column; box-shadow: 0 -20px 60px rgba(0,0,0,.6); }
  .sheet::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 99px; background: var(--line2); }
  .sheet .pn { height: 100%; }
  .dev .scr > .penny-help { left: 18px; bottom: 18px; width: 50px; height: 50px; z-index: 15; }

  /* the guided tour: a spotlight, a ring and Penny's card */
  .coach { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
  .coach-mask { position: absolute; inset: 0; background: rgba(5,4,3,.74); pointer-events: auto; transition: clip-path .5s var(--ease), opacity .4s; }
  .coach-ring { position: absolute; border-radius: 18px; box-shadow: 0 0 0 2px var(--gold), 0 0 0 7px rgba(228,176,74,.18), 0 0 40px rgba(228,176,74,.45); transition: left .45s var(--ease), top .45s var(--ease), width .45s var(--ease), height .45s var(--ease), opacity .3s; pointer-events: none; }
  .coach-card { position: absolute; left: 16px; right: 16px; max-width: 380px; margin: 0 auto; pointer-events: auto; background: linear-gradient(180deg, #1D1812, #120E0A); border: 1px solid var(--line2); border-radius: 20px; padding: 14px 16px 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 40px -10px rgba(228,176,74,.25); transition: top .5s var(--ease), opacity .3s; }
  .coach-card .hd { display: flex; align-items: center; gap: 10px; }
  .coach-card .fc { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--gold); overflow: hidden; }
  .coach-card .ti { font: 600 16px var(--display); flex: 1; }
  .coach-card .ct { font: 600 10.5px var(--mono); letter-spacing: .12em; color: var(--faint); }
  .coach-card p { margin: 9px 0 0; font-size: 14px; line-height: 1.55; color: #E8E0D2; }
  .coach-card p b { color: var(--gold-hi); font-weight: 700; }
  .coach-card .ft { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .coach-card .dots { display: flex; gap: 5px; flex: 1; }
  .coach-card .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(228,176,74,.2); transition: all .3s; }
  .coach-card .dots i.on { width: 18px; border-radius: 99px; background: var(--gold); }
  .coach-card .nx { border: 0; border-radius: 999px; padding: 9px 18px; font: 700 13.5px var(--display); color: #17120A; background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); cursor: pointer; }
  .coach-card .tap { font: 600 12.5px var(--display); color: var(--gold-hi); display: inline-flex; align-items: center; gap: 6px; }
  .coach-card .tap i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(228,176,74,.6); }
  .coach-card .sk { background: none; border: 0; color: var(--faint); font: 500 12px var(--body); cursor: pointer; padding: 6px; }
  .coach-card .sk:hover { color: var(--text); }
  .coach.final .coach-card { text-align: center; padding: 20px 20px 18px; }
  .coach.final .bigp { width: 120px; height: 120px; margin: 0 auto 4px; }
  .coach.final .coach-card .ti { display: block; font-size: 22px; }

  /* the WorthIt start-up */
  .launch { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden;
    background: radial-gradient(60% 45% at 50% 42%, #2A1F10 0%, #0B0907 70%); clip-path: circle(150% at var(--x) var(--y)); }
  .launch .lm { width: 150px; position: relative; z-index: 2; filter: drop-shadow(0 0 40px rgba(228,176,74,.55)); }
  .launch .ln { font: 800 34px var(--display); letter-spacing: -.03em; position: relative; z-index: 2; }
  .launch .lbar { width: 160px; height: 3px; border-radius: 99px; background: rgba(228,176,74,.15); overflow: hidden; margin-top: 10px; position: relative; z-index: 2; }
  .launch .lbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); border-radius: 99px; }
  .launch .lt { font: 600 10.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--gold-hi); position: relative; z-index: 2; min-height: 14px; }
  .launch .lring { position: absolute; left: 50%; top: 42%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; border: 1.5px solid rgba(243,210,122,.6); box-shadow: 0 0 40px rgba(228,176,74,.4); }

<script>
// WorthIt shared helpers: used by the page panel, the toolbar popup and the grown-up settings page.
// Everything here is pure maths and formatting. No network, no tracking.

var WorthIt = (() => {
  const PERIOD_DAYS = { day: 1, week: 7, month: 30.4 };
  const MONTH_DAYS = 30.4;
  const SYMBOLS = { SGD: "S$", USD: "US$", MYR: "RM", AUD: "A$", HKD: "HK$", GBP: "£", EUR: "€", INR: "₹" };

  // Every key WorthIt ever stores, all in chrome.storage.local on this computer.
  const SETTINGS_KEYS = ["amount", "period", "name", "currency", "region", "waitDays", "enabled", "goalName", "goalAmount", "goalSaved", "aiEnabled", "nanoEnabled", "age"];
  const DATA_KEYS = ["wishlist", "collapsed"];

  const DEFAULTS = {
    amount: 0,
    period: "week",
    name: "",
    currency: "SGD",
    region: "SG",
    waitDays: 3,
    enabled: true,
    goalName: "",
    goalAmount: 0,
    goalSaved: 0,
    aiEnabled: true,
    nanoEnabled: false,
  };

  function perDay(settings) {
    const amount = Number(settings.amount) || 0;
    return amount / (PERIOD_DAYS[settings.period] || 7);
  }

  function perWeek(settings) {
    return perDay(settings) * 7;
  }

  function perMonth(settings) {
    return perDay(settings) * MONTH_DAYS;
  }

  function daysFor(price, settings) {
    const pd = perDay(settings);
    return pd > 0 ? price / pd : null;
  }

  function roundDays(days) {
    if (days == null) return null;
    if (days < 10) return Math.max(0.1, Math.round(days * 10) / 10);
    return Math.round(days);
  }

  function daysLabel(days) {
    const r = roundDays(days);
    return `${r} ${r === 1 ? "day" : "days"}`;
  }

  function plural(n, word) {
    return `${n} ${n === 1 ? word : word + "s"}`;
  }

  // A friendly, concrete comparison a young child can picture.
  function contextLine(days) {
    if (days == null) return "";
    if (days < 1) return "That's less than one day of allowance.";
    if (days < 7) return "That's less than a week of saving.";
    if (days < 8) return "That's about a week of saving.";
    if (days < 14) return "That's more than a week of saving.";
    if (days < 60) return `That's about ${Math.round(days / 7)} weeks of saving.`;
    if (days < 365) return `That's about ${Math.round(days / MONTH_DAYS)} months of saving.`;
    const y = Math.round((days / 365) * 10) / 10;
    return `That's about ${y} ${y === 1 ? "year" : "years"} of saving.`;
  }

  function money(price, currency) {
    const sym = SYMBOLS[(currency || "").toUpperCase()] || "$";
    const n = Number(price) || 0;
    const hasCents = Math.round(n * 100) % 100 !== 0;
    return sym + n.toLocaleString("en-US", {
      minimumFractionDigits: hasCents ? 2 : 0,
      maximumFractionDigits: 2,

  function whose(settings) {
    return settings.name ? `${settings.name}'s` : "your";
  }

    const out = Object.assign({}, DEFAULTS, s || {});
    out.goalAmount = Number(out.goalAmount) || 0;
    out.goalSaved = Number(out.goalSaved) || 0;
    out.waitDays = Number(out.waitDays) || 3;
    return out;
  }

  function sameMoney(currency, settings) {
    return !currency || String(currency).toUpperCase() === String(settings.currency || "SGD").toUpperCase();
  }

  // Weeks needed to afford a price if the child puts aside `share` (0..1) of their allowance.
  function weeksToSave(price, settings, share) {
    const weekly = perWeek(settings) * share;
    if (!(weekly > 0)) return null;
    return Math.max(1, Math.ceil(price / weekly));

    const t = { total: 0, skip: 0, swap: 0, count: 0 };

  const TRIAL_DAYS = 7;
  const PRICE_LABEL = "S$4 a month or S$40 a year";
  const PLANS = [
    { id: "monthly", name: "Monthly", price: "S$4", per: "/month", note: "Cancel any time" },
    { id: "yearly", name: "Yearly", price: "S$40", per: "/year", note: "S$3.33 a month", best: "Save 17%" },
  ];

  const FREE_SCANS_PER_DAY = 3; // on the free plan, WorthIt checks 3 different products a day

  // The family plan unlocks: unlimited price checks, Better buy and Save the Planet, and lessons 4-8.

    if (paid) return { mode: "paid", locked: false, daysLeft, paid };

    return { mode: "ended", locked: true, daysLeft: 0, paid };

  }

  const CSS = `
  .pa { position:relative; display:block; width:100%; height:100%; }
  .pa img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .pa .pa-shadow { position:absolute; left:22%; right:22%; bottom:-2%; height:7%; border-radius:50%; background:rgba(0,0,0,.45); filter:blur(3px); }
  .pa .spk { position:absolute; width:12%; height:12%; opacity:0; pointer-events:none; }
  .pa .spk::before, .pa .spk::after { content:""; position:absolute; left:50%; top:50%; background:#FFE7A3; border-radius:2px; transform:translate(-50%,-50%); box-shadow:0 0 8px #F6C85A; }
  .pa .spk::before { width:100%; height:22%; } .pa .spk::after { width:22%; height:100%; }
  .pa .s1 { left:2%; top:8%; } .pa .s2 { right:0; top:20%; } .pa .s3 { left:8%; bottom:26%; } .pa .s4 { right:6%; bottom:12%; }
  .pa-face { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  @media (prefers-reduced-motion: no-preference) {
    .pa .pa-body { position:absolute; inset:0; animation: pa-flip .9s cubic-bezier(.2,.9,.3,1.2) both, pa-bob 2.6s .9s ease-in-out infinite; transform-origin:50% 90%; }
    .pa .pa-body img { animation: none; transform-origin:50% 85%; }
    .pa .pa-shadow { animation: pa-shadow 2.6s .9s ease-in-out infinite; }
    .pa.m-wave .pa-body img { animation: pa-wave 1.1s .9s ease-in-out 3; }
    .pa.m-think .pa-body img { animation: pa-think 3.2s .9s ease-in-out infinite; }
    .pa.m-cheer .pa-body img { animation: pa-jump .75s .2s cubic-bezier(.3,.7,.4,1) 3; }
    .pa.m-cheer .spk, .pa.m-wow .spk { animation: pa-spark 1.4s ease-out infinite; }
    .pa .s2 { animation-delay: .25s !important; } .pa .s3 { animation-delay: .5s !important; } .pa .s4 { animation-delay: .75s !important; }
    .pa.m-wow .pa-body img { animation: pa-wow .7s .3s cubic-bezier(.2,1.6,.4,1) both; }
    .pa.again .pa-body { animation: pa-hop .6s cubic-bezier(.3,.7,.4,1) both, pa-bob 2.6s .6s ease-in-out infinite; }
  }
  @keyframes pa-flip { 0% { transform: perspective(500px) rotateY(-540deg) scale(.4); opacity:0; } 60% { opacity:1; } 100% { transform: perspective(500px) rotateY(0) scale(1); } }
  @keyframes pa-bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6%) rotate(-2deg); } }
  @keyframes pa-shadow { 0%,100% { transform: scaleX(1); opacity:1; } 50% { transform: scaleX(.8); opacity:.6; } }
  @keyframes pa-wave { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  @keyframes pa-think { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(4deg) translateX(2%); } }
  @keyframes pa-jump { 0% { transform: scale(1,1); } 18% { transform: scale(1.12,.86); } 45% { transform: translateY(-13%) scale(.92,1.1) rotate(-6deg); } 70% { transform: translateY(0) scale(1.08,.9); } 100% { transform: scale(1,1); } }
  @keyframes pa-wow { 0% { transform: scale(.85); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes pa-hop { 0% { transform: translateY(0); } 40% { transform: translateY(-14%) rotate(6deg); } 100% { transform: translateY(0); } }
  @keyframes pa-spark { 0% { opacity:0; transform: scale(.2) rotate(0); } 30% { opacity:1; transform: scale(1) rotate(45deg); } 100% { opacity:0; transform: scale(.3) rotate(90deg); } }
  `;
  function svg(mood, opts) {
    if (opts && opts.face) return `<img class="pa-face" src="${FACE}" alt="" draggable="false">`;
    const m = mood || "happy";
    return `<span class="pa m-${m}" aria-hidden="true"><span class="pa-shadow"></span><span class="pa-body"><img src="${FULL}" alt="" draggable="false"></span><i class="spk s1"></i><i class="spk s2"></i><i class="spk s3"></i><i class="spk s4"></i></span>`;
  }
  // Change Penny's mood in place with a little hop, without replaying her entrance.
  function mood(el, m) {
    const pa = el && (el.classList && el.classList.contains("pa") ? el : el.querySelector(".pa"));
    if (!pa) return;
    pa.className = "pa m-" + m;
    void pa.offsetWidth; // restart the animation
    pa.classList.add("again");
  }
  return { svg, mood, CSS, FULL, FACE };
})();

// WorthIt first-run setup: Penny walks the child and a grown-up through it, one question per screen.
// Everything answered here is saved only on this computer (chrome.storage.local).

var WorthItOnboard = (() => {
  const CSS = `
  .ob, .ob * { box-sizing:border-box; }
  .ob { --gold:#E4B04A; --bg:#0B0907; --raise:#16130F; --line:#322A20; --edge:#4A3E24; --text:#F8F5EE; --mute:#A69C8E; --green:#8FD1A6;
    position:relative; display:flex; flex-direction:column; height:100%; min-height:520px; background:radial-gradient(90% 50% at 50% 0%, rgba(228,176,74,.13) 0%, rgba(228,176,74,0) 70%), var(--bg); color:var(--text);
    font-family:"WorthIt Manrope","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  .ob-top { display:flex; align-items:center; gap:10px; padding:14px 16px 0; }
  .ob-back { width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--mute); cursor:pointer; font-size:16px; }
  .ob-back:disabled { visibility:hidden; }
  .ob-bar { flex:1; height:4px; border-radius:99px; background:rgba(228,176,74,.14); }
  .ob-bar i { position:relative; display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#C9953B,#F3D27A); transition:width .8s cubic-bezier(.16,1,.3,1); }
  .ob-bar i::after { content:""; position:absolute; right:-5px; top:50%; width:10px; height:10px; margin-top:-5px; border-radius:50%; background:#FFF1C9; box-shadow:0 0 0 3px rgba(243,210,122,.25), 0 0 14px rgba(246,200,90,.9); }
  .ob-who { font:700 10px "WorthIt Mono","JetBrains Mono",ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); border:1px solid var(--edge); border-radius:99px; padding:4px 9px; white-space:nowrap; }
  .ob-who.grown { color:var(--green); border-color:#2F6B47; }
  .ob-stage { flex:1; display:flex; flex-direction:column; align-items:center; padding:22px 22px 0; overflow-y:auto; min-height:0; }
  .ob-penny { width:132px; height:132px; flex:0 0 auto; }
  .ob-burst { position:absolute; width:0; height:0; pointer-events:none; z-index:9; }
  .ob-burst i { position:absolute; left:-6px; top:-6px; width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #FFF1BF, #F0C463 45%, #B9862A); box-shadow:0 0 6px rgba(246,200,90,.6); opacity:0; }
  .ob-chip:active, .ob-card:active, .ob-go:active { transform:scale(.96); }
  .ob-chip, .ob-card, .ob-go { transition: transform .15s, border-color .15s, background .15s; }
  .ob-say { position:relative; max-width:360px; background:linear-gradient(180deg,#1C1712,#141009); border:1px solid rgba(228,176,74,.28); border-radius:18px; padding:13px 18px; text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.4); font:600 17px/1.4 "WorthIt Outfit","Outfit",system-ui,sans-serif; margin:6px 0 14px; }
  .ob-say::before { content:""; position:absolute; top:-8px; left:50%; margin-left:-8px; border:8px solid transparent; border-top:0; border-bottom-color:var(--edge); }
  .ob-say b { color:var(--gold); }
  .ob-sub { margin:-6px 0 14px; font-size:13px; color:var(--mute); text-align:center; max-width:340px; line-height:1.5; }
  .ob-body { width:100%; max-width:360px; display:flex; flex-direction:column; gap:10px; }
  .ob-in { width:100%; background:rgba(255,255,255,.02); border:1px solid rgba(228,176,74,.2); color:var(--text); border-radius:14px; padding:14px 16px; font:700 18px "WorthIt Outfit","Outfit",system-ui,sans-serif; text-align:center; }
  .ob-in:focus { outline:none; border-color:var(--gold); }
  .ob-row { display:flex; gap:8px; }
  .ob-row > * { flex:1; min-width:0; }
  .ob-chips { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .ob-chip { background:rgba(255,255,255,.02); border:1px solid rgba(228,176,74,.18); color:var(--text); border-radius:14px; padding:12px 8px; font:600 16px "WorthIt Outfit","Outfit",system-ui,sans-serif; cursor:pointer; }
  .ob-chip:hover, .ob-card:hover { border-color:rgba(228,176,74,.45); background:rgba(228,176,74,.05); }
  .ob-chip:active, .ob-card:active { transform:scale(.97); }
  .ob-chip.wrong { border-color:#7A3B32; color:#E9A38F; }
  .ob-chip:hover { border-color:var(--edge); }
  .ob-chip[aria-pressed="true"] { border-color:#E4B04A; background:linear-gradient(180deg,rgba(228,176,74,.18),rgba(228,176,74,.06)); color:#F3D27A; box-shadow:0 0 0 1px rgba(228,176,74,.35), 0 8px 24px rgba(228,176,74,.15); }
  .ob-card { display:flex; align-items:center; gap:12px; text-align:left; background:rgba(255,255,255,.02); border:1px solid rgba(228,176,74,.18); color:var(--text); border-radius:16px; padding:13px 16px; cursor:pointer; font-family:inherit; }
  .ob-card[aria-pressed="true"] { border-color:#E4B04A; background:linear-gradient(180deg,rgba(228,176,74,.16),rgba(228,176,74,.05)); box-shadow:0 0 0 1px rgba(228,176,74,.35), 0 8px 24px rgba(228,176,74,.12); }
  .ob-card b { display:block; font:800 16px "WorthIt Outfit","Outfit",system-ui,sans-serif; }
  .ob-card span { font-size:12.5px; color:var(--mute); }
  .ob-card .tag { margin-left:auto; font:700 10px "WorthIt Mono","JetBrains Mono",monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--green); border:1px solid #2F6B47; border-radius:99px; padding:3px 7px; white-space:nowrap; }
  .ob-hint { font-size:12.5px; color:var(--mute); text-align:center; }
  .ob-hint button { background:none; border:0; color:var(--gold); font:inherit; font-weight:800; cursor:pointer; text-decoration:underline; }
  .ob-big { font:800 52px/1 "WorthIt Outfit","Outfit",system-ui,sans-serif; letter-spacing:-.03em; color:var(--gold); text-align:center; }
  .ob-foot { padding:12px 22px 18px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .ob-go { width:100%; max-width:360px; border:0; border-radius:999px; padding:15px; background:linear-gradient(180deg,#F5D686,#E4B04A 55%,#C9953B); color:#17120A; font:700 16px "WorthIt Outfit","Outfit",system-ui,sans-serif; letter-spacing:.02em; cursor:pointer; box-shadow:0 12px 32px rgba(228,176,74,.28), inset 0 1px 0 rgba(255,255,255,.55); transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, filter .25s; }
  .ob-go:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.05); box-shadow:0 16px 40px rgba(228,176,74,.38), inset 0 1px 0 rgba(255,255,255,.55); }
  .ob-go:active:not(:disabled) { transform:scale(.98); }
  .ob-go:disabled { background:transparent; color:#6F6658; border:1px solid rgba(228,176,74,.16); cursor:default; box-shadow:none; }
  .ob-skip { background:none; border:0; color:var(--mute); font:700 13px inherit; font-family:inherit; cursor:pointer; }
  .ob-hold { position:relative; width:150px; height:150px; border-radius:50%; border:0; background:var(--raise); cursor:pointer; display:grid; place-items:center; touch-action:none; user-select:none; -webkit-user-select:none; }
  .ob-hold svg.ring { position:absolute; inset:0; transform:rotate(-90deg); }
  .ob-hold .lbl { font:800 15px/1.2 "WorthIt Outfit","Outfit",system-ui,sans-serif; color:var(--text); max-width:100px; text-transform:none; letter-spacing:0; }
  .ob-hold { transition:transform .2s, box-shadow .3s; box-shadow:0 0 0 0 rgba(228,176,74,0); }
  .ob-hold.holding { transform:scale(.94); box-shadow:0 0 50px 6px rgba(228,176,74,.35); }
  .ob-hold.made { background:radial-gradient(circle,#3A2C14,#16130F 70%); box-shadow:0 0 60px 8px rgba(228,176,74,.4); }
  .ob-hold.seal { width:190px; height:190px; background:radial-gradient(circle,#211A10,#0F0C09 70%); }
  .ob-hold.seal svg.ring { width:190px; height:190px; }
  .ob-hold.seal img { position:absolute; inset:20px; width:150px; height:150px; pointer-events:none; -webkit-user-drag:none; }
  .ob-hold.seal .sg { filter:grayscale(1) brightness(.55); }
  .ob-hold.seal .sc { opacity:0; }
  .ob-hold.seal.made .sc { opacity:1; }
  .ob-holdlbl { display:block; text-align:center; }
  .ob-holdlbl .lbl { font:800 15px/1.2 "WorthIt Outfit","Outfit",system-ui,sans-serif; color:var(--gold-hi,#F3D27A); }
  .ob-unlock img.md { background:none; box-shadow:none; object-fit:contain; }
  @media (prefers-reduced-motion: no-preference) { .ob-hold.seal.made .sc { animation:ob-sealbeat 2.4s .5s ease-in-out infinite; will-change:transform; } }
  @keyframes ob-sealbeat { 0%,100% { transform:scale(1) rotate(0); } 50% { transform:scale(1.05) rotate(-3deg); } }
  .ob-promise { font:700 15px/1.5 "WorthIt Outfit","Outfit",system-ui,sans-serif; text-align:center; color:var(--text); background:var(--raise); border:1px dashed var(--edge); border-radius:14px; padding:12px 14px; }
  .ob-time { display:grid; gap:0; }
  .ob-t { display:flex; gap:12px; padding:9px 0; }
  .ob-t .dot { width:14px; height:14px; border-radius:50%; background:var(--gold); margin-top:4px; flex:0 0 auto; box-shadow:0 0 0 4px rgba(228,176,74,.15); }
  .ob-t.later .dot { background:var(--edge); box-shadow:none; }
  .ob-t b { display:block; font:800 15px "WorthIt Outfit","Outfit",system-ui,sans-serif; }
  .ob-t span { font-size:12.5px; color:var(--mute); line-height:1.45; }
  .ob-pin { display:flex; align-items:center; justify-content:center; gap:10px; background:#ECEAE4; color:#18181B; border-radius:14px; padding:12px; font:700 13px system-ui,sans-serif; }
  .ob-pin .ic { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:#fff; border:1px solid #DDD; font-size:16px; }
  .ob-quest { background:var(--raise); border:1px solid var(--edge); border-radius:14px; padding:12px 14px; font-size:13.5px; color:#CFC6B8; }

  const SHOPS = {
    toysrus: { name: "Toys\u201cR\u201dUs", host: "toysrus.com.sg", text: "Toys, games and building sets", url: (q) => "https://www.toysrus.com.sg/search?q=" + q },
    popular: { name: "Popular", host: "popular.com.sg", text: "Books, stationery and art supplies", url: (q) => "https://popular.com.sg/search?q=" + q },
    decathlon: { name: "Decathlon", host: "decathlon.sg", text: "Sports gear, bikes and scooters", url: (q) => "https://www.decathlon.sg/search?query=" + q },
    challenger: { name: "Challenger", host: "challenger.sg", text: "Gadgets and video games", url: (q) => "https://www.challenger.sg/search?q=" + q },
    courts: { name: "Courts", host: "courts.com.sg", text: "Electronics and things for the home", url: (q) => "https://www.courts.com.sg/search?q=" + q },
    zalora: { name: "Zalora", host: "zalora.sg", text: "Clothes and shoes", url: (q) => "https://www.zalora.sg/search?q=" + q },
    amazon_sg: { name: "Amazon.sg", host: "amazon.sg", text: "Lots of shops in one place", url: (q) => "https://www.amazon.sg/s?k=" + q },
    shopee_sg: { name: "Shopee", host: "shopee.sg", text: "Lots of shops in one place", url: (q) => "https://shopee.sg/search?keyword=" + q },
    lazada_sg: { name: "Lazada", host: "lazada.sg", text: "Lots of shops in one place", url: (q) => "https://www.lazada.sg/catalog/?q=" + q },
    shopee_my: { name: "Shopee", host: "shopee.com.my", text: "Lots of shops in one place", url: (q) => "https://shopee.com.my/search?keyword=" + q },
    lazada_my: { name: "Lazada", host: "lazada.com.my", text: "Lots of shops in one place", url: (q) => "https://www.lazada.com.my/catalog/?q=" + q },
    amazon_com: { name: "Amazon", host: "amazon.com", text: "Lots of shops in one place", url: (q) => "https://www.amazon.com/s?k=" + q },
    ebay_new: { name: "eBay", host: "ebay.com", text: "New ones from many sellers", url: (q) => "https://www.ebay.com/sch/i.html?LH_ItemCondition=1000&_nkw=" + q },
  };
  const SHOPS_BY_KIND = {
    building: ["toysrus", "amazon_sg", "shopee_sg"], toys: ["toysrus", "amazon_sg", "shopee_sg"], plush: ["toysrus", "amazon_sg", "shopee_sg"],
    puzzle: ["toysrus", "popular", "amazon_sg"], book: ["popular", "amazon_sg", "shopee_sg"], arts: ["popular", "shopee_sg", "amazon_sg"],
    school: ["popular", "shopee_sg", "amazon_sg"], ride: ["decathlon", "toysrus", "shopee_sg"], sports: ["decathlon", "shopee_sg", "amazon_sg"],
    game: ["challenger", "amazon_sg", "shopee_sg"], electronics: ["challenger", "courts", "amazon_sg"], clothes: ["zalora", "decathlon", "shopee_sg"],
    home: ["courts", "amazon_sg", "shopee_sg"], general: ["amazon_sg", "lazada_sg", "shopee_sg"],
  };

  function shopsFor(kind, region, pageHost) {
    let ids;
    if (region === "MY") ids = ["lazada_my", "shopee_my", "amazon_com"];
    else if (region === "OTHER") ids = ["amazon_com", "ebay_new"];
    else ids = (SHOPS_BY_KIND[kind] || SHOPS_BY_KIND.general).concat(SHOPS_BY_KIND.general);
    const here = String(pageHost || "").replace(/^www\./, "");
    const seen = new Set();
    const out = [];
    for (const id of ids) {
      const shop = SHOPS[id];
      if (!shop || seen.has(shop.name) || (here && (here === shop.host || here.endsWith("." + shop.host)))) continue;
      seen.add(shop.name);
      out.push({ id, ...shop });
      if (out.length === 3) break;
    }
    return out;
  }

  function create(opts) {
    const { root, store, markUrl, mode = "page", openUrl, openSettings, onMinimize, onClose, onItem, ai } = opts;
    const pageLike = mode !== "toolbar"; // "page" on shops, "embed" on the WorthIt website
    let page = opts.page || null; // { url, host, key }
    let product = opts.product || null;
    let tab = pageLike ? "cost" : "wish";
    // Two areas, one switch: "This item" (Cost · Learn · Better buy) and "Wish list & lessons" (Wish list · Lessons).
    let area = pageLike ? "item" : "me";
    let lesson = null;
    let quizPick = null;
    let saveShare = 0.5;
    let lessonView = null; // index of the lesson on screen; null means the next one
    let lessonPick = null;
    let scrollAns = false; // after answering, bring the answer into view
    let levelUp = null; // the new level name, shown once when a lesson moves the child up
    let celebrate = []; // badges just earned, shown once at the top
    let lookedAt = null; // product key already counted for First Look / Curious Mind
    let learnedAt = null;
    let destroyed = false;
    const aiState = new Map(); // product key -> { status: "loading" | "ok" | "off" | "unavailable" | "error", data, example }

    adoptStyles(root);
    if (typeof WorthItPenny !== "undefined") {
      const extra = WorthItPenny.HELP_CSS + `
      .wi .penny-help { left:10px; bottom:6px; z-index:7; }
      .wi .foot { padding-left:62px; }
      .wi .pnov { position:absolute; inset:0; z-index:30; background:#0C0A07; padding:14px; display:flex; flex-direction:column; border-radius:inherit; }
      .wi .pnov .pn { height:100%; }`;
      try { const sh = new CSSStyleSheet(); sh.replaceSync(extra); root.adoptedStyleSheets = [...root.adoptedStyleSheets, sh]; }
      catch (e) { root.appendChild(el("style", {}, extra)); }
    }
    let helpOv = null;
    let helpCtx = { name: "" };
    const wrap = el("div", { class: "wi " + mode, role: mode === "page" ? "dialog" : null, "aria-label": "WorthIt" });
    root.appendChild(wrap);

    const now = () => (opts.now ? opts.now() : Date.now());

    async function load() {
      const raw = await store.get([...W.SETTINGS_KEYS, "wishlist", "lessonsDone", "quest", "installedAt", "trialStartedAt", "planActive", "scans"]);
      const done = Array.isArray(raw.lessonsDone) ? raw.lessonsDone.filter((id) => LESSONS.some((l) => l.id === id)) : [];
      const plan = typeof WorthItPlan !== "undefined" ? WorthItPlan.state(raw, now()) : { mode: "free", locked: false };
      return { s: W.withDefaults(raw), wishlist: Array.isArray(raw.wishlist) ? raw.wishlist : [], done, quest: raw.quest, plan, scans: raw.scans };
    }

    function allows(st, feature) {
      return typeof WorthItPlan === "undefined" || WorthItPlan.allows(st.plan, feature);
    }

    // Badges: record what the child did; celebrate any badge that is new.
    async function earn(events, extra) {
      if (typeof WorthItQuest === "undefined" || destroyed) return;
      const fresh = await WorthItQuest.record(store, events, Object.assign({ now }, extra || {}));
      if (fresh.length) { celebrate = fresh; render(); }
    }

    function openLink(e) {
      if (openUrl) { e.preventDefault(); openUrl(e.currentTarget.href); }
    }

    // ---------------- header, tabs, footer ----------------

    function header() {
      const h = el("div", { class: "head" },
        el("img", { class: "mk", src: markUrl, alt: "" }),
        el("span", { class: "nm" }, "Worth", el("em", {}, "It")),
        el("span", { class: "sp" }));
      if (openSettings) h.append(el("button", { class: "ghost", title: "Parent settings", "aria-label": "Parent settings", html: ICON.gear, on: { click: () => openSettings() } }));
      if (onMinimize) h.append(el("button", { class: "ghost", title: "Make smaller", "aria-label": "Make smaller", html: ICON.min, on: { click: () => onMinimize() } }));
      if (onClose) h.append(el("button", { class: "ghost", title: "Close on this page", "aria-label": "Close", html: ICON.close, on: { click: () => onClose() } }));
      return h;
    }

    function tabsBar(st) {
      const list = area === "item" ? [["cost", "Cost"], ["learn", "Learn"], ["better", "Better buy"]] : [["wish", "Wish list"], ["lessons", "Lessons"], ["badges", "Badges"]];
      const bar = el("div", { class: "tabs", role: "tablist" });
      for (const [id, label] of list) {
        const b = el("button", { class: "tab", role: "tab", "aria-selected": String(tab === id), "data-tab": id }, label);
        if (id === "wish" && st.wishlist.length) b.append(el("span", { class: "ct" }, String(st.wishlist.length)));
        b.addEventListener("click", () => { tab = id; lesson = null; lessonPick = null; celebrate = []; render(); });
        bar.append(b);
      }
      return bar;
    }

    function switchBar(st) {
      const canItem = (pageLike && product) || (!pageLike && onItem);
      if (!canItem) return null;
      const bar = el("div", { class: "switch", role: "group", "aria-label": "What to show" });
      const go = (a) => {
        if (a === area) return;
        if (a === "item" && !pageLike) { onItem(); return; } // from the toolbar: open WorthIt on the shopping page
        area = a; tab = a === "item" ? "cost" : "wish"; lesson = null; lessonPick = null; lessonView = null; render();
      };
      bar.append(el("button", { "aria-pressed": String(area === "item"), "data-area": "item", on: { click: () => go("item") } }, "This item"),
        el("button", { "aria-pressed": String(area === "me"), "data-area": "me", on: { click: () => go("me") } }, "Wish list & lessons",
          st.wishlist.length ? el("span", { class: "ct" }, String(st.wishlist.length)) : null));
      return bar;
    }

    function footer() {
      const f = el("div", { class: "foot" }, pageLike ? "Always ask a grown-up before buying online." : "Stays on this computer.");
      if (!pageLike && openSettings) f.append(el("a", { href: "#", on: { click: (e) => { e.preventDefault(); openSettings(); } } }, "Parent settings"));
      return f;
    }

    // The badge art (badgeart.js) when it's loaded; the emoji otherwise.
    function badgeIcon(id, fallback) {
      const art = typeof WorthItBadgeArt !== "undefined" && WorthItBadgeArt[id];
      return art ? el("img", { class: "bi", src: art, alt: "", draggable: "false" }) : el("span", { class: "bi", "aria-hidden": "true" }, fallback);
    }
    function badgePop() {
      if (!celebrate.length) return null;
      const b = celebrate[0];
      const more = celebrate.length > 1 ? ` (+${celebrate.length - 1} more)` : "";
      return el("div", { class: "pop", role: "status" }, badgeIcon(b.id, b.icon),
        el("p", {}, el("b", {}, b.secret ? `Secret badge found: ${b.name}!` : `New badge: ${b.name}!`), ` ${b.did || b.how}${more}`),
        el("button", { class: "x", "aria-label": "Hide", title: "Hide", on: { click: () => { celebrate = []; render(); } } }, "×"));
    }

    function lockCard(what) {
      const P = typeof WorthItPlan !== "undefined" ? WorthItPlan : { TRIAL_DAYS: 7 };
      return el("div", { class: "lock", "data-locked": "1" }, el("div", { class: "li", "aria-hidden": "true" }, "🔒"),
        el("h5", {}, `${what} is in the family plan`),
        el("p", {}, `Your free ${P.TRIAL_DAYS}-day week is over. Ask a grown-up to unlock the family plan. Prices in days, your wish list, Learn and your badges stay free.`),
        openSettings ? el("button", { class: "golink", style: "margin-top:10px", on: { click: () => openSettings() } }, "Show a grown-up") : null);
    }

    function scanLimit() {
      const P = typeof WorthItPlan !== "undefined" ? WorthItPlan : { FREE_SCANS_PER_DAY: 3 };
      return [el("div", { class: "lock", "data-locked": "scans" }, el("div", { class: "li", "aria-hidden": "true" }, "⏳"),
        el("h5", {}, `That's your ${P.FREE_SCANS_PER_DAY} price checks for today`),
        el("p", {}, `The free plan checks ${P.FREE_SCANS_PER_DAY} different things a day. Come back tomorrow, or ask a grown-up about the family plan for unlimited checks. Things you already checked today still work.`),
        openSettings ? el("button", { class: "golink", style: "margin-top:10px", on: { click: () => openSettings() } }, "Show a grown-up") : null,
        el("button", { class: "golink", style: "margin-top:6px", on: { click: () => { area = "me"; tab = "wish"; render(); } } }, "Go to my wish list & lessons →"))];
    }

    function lessonBox() {
      if (!lesson) return null;
      return el("div", { class: "lesson", role: "status" }, el("p", {}, lesson),
        el("button", { class: "x", "aria-label": "Hide", title: "Hide", on: { click: () => { lesson = null; render(); } } }, "×"));
    }

    // ---------------- Cost: the price, in perspective ----------------

    function coins(days) {
      const row = el("div", { class: "coins", "aria-hidden": "true" });
      const shown = Math.min(Math.ceil(days), 20);
      for (let i = 0; i < shown; i++) {
        const partial = i === shown - 1 && days < 20 && days % 1 !== 0 && days % 1 < 0.75;
        row.append(el("span", { class: partial ? "coin part" : "coin" }));
      }
      if (Math.ceil(days) > 20) row.append(el("span", { class: "more" }, `+${Math.ceil(days) - 20} more`));
      return row;
    }

    function panelCost(st) {
      const { s, wishlist } = st;
      const p = product;
      const out = [
        el("p", { class: "kicker" }, "Price on this page"),
        el("div", { class: "hero" }, el("span", { class: "amt" }, W.money(p.price, p.currency || s.currency)), el("span", { class: "of", title: p.name || "" }, shortName(p.name))),
      ];
      if (!(W.perDay(s) > 0)) {
        out.push(el("p", { class: "note" }, "Ask a grown-up to set up your allowance, and WorthIt will show this in days."));
        if (openSettings) out.push(el("button", { class: "primary", on: { click: () => openSettings() } }, "Set up WorthIt"));
        return out;
      }
      const days = W.daysFor(p.price, s);
      const same = W.sameMoney(p.currency, s);
      const pct = Math.round((p.price / W.perMonth(s)) * 100);
      const ctx = el("div", { class: "ctx" }, W.contextLine(days).replace(/\.$/, ""), pct >= 5 ? `, or ${pct}% of your monthly allowance.` : ".");
      if (s.goalName && s.goalAmount > 0 && same) {
        const g = Math.round((p.price / s.goalAmount) * 100);
        ctx.append(el("br"), g >= 100 ? `That's more than your whole ${W.goalLabel(s.goalName)}.` : `That's ${g}% of your ${W.goalLabel(s.goalName)}.`);
      }
      out.push(el("div", { class: "days" },
        el("div", { class: "big" }, W.daysLabel(days)),
        el("div", { class: "who" }, "of your allowance"),
        coins(days), ctx));
      if (!same) out.push(el("p", { class: "note warn" }, "This shop uses different money, so the days are only a guess."));

      const key = page && page.key;
      out.push(el("div", { class: "think" }, el("p", { class: "kicker m" }, "Think it over"), el("div", { class: "q" }, THINK_PROMPTS[W.hashIndex(p.name || key, THINK_PROMPTS.length)])));
      const onList = wishlist.find((w) => w.key === key);
      if (onList) {
        const left = Math.max(0, Math.ceil(s.waitDays - (now() - (onList.savedAt || 0)) / 864e5));
        out.push(el("button", { class: "primary done", disabled: true }, icon("check"), left > 0 ? `On your wish list · think it over for ${W.plural(left, "day")}` : "On your wish list · ready to decide"));
      } else {
        out.push(el("button", { class: "primary", "data-act": "wish", on: { click: async () => {
          const cur = await load();
          if (!cur.wishlist.some((w) => w.key === key)) {
            cur.wishlist.unshift({ key, name: p.name || "Item", price: p.price, currency: p.currency || null, url: page.url, host: page.host, savedAt: now() });
            await store.set({ wishlist: cur.wishlist.slice(0, MAX_WISH) });
          }
          lesson = `Good thinking. Waiting ${W.plural(s.waitDays, "day")} helps you tell a want from a need.`;
          render();
          earn(["thinker", "learned"]);
        } } }, icon("star"), "Save to my wish list"));
      }
      out.push(el("button", { class: "golink", "data-act": "learn", on: { click: () => { tab = "learn"; lesson = null; render(); } } }, "What else could it be? →"));
      return out;
    }

    // ---------------- Learn: what else it could be, and short lessons ----------------

    function card(title, ...body) {
      return el("div", { class: "lcard" }, el("h5", {}, title), ...body);
    }

    function aiResult() {
      const r = aiState.get(aiKey());
      return r && r.status === "ok" && r.data ? r : null;
    }

    function panelLearn(st) {
      const { s } = st;
      const p = product;
      const has = W.perDay(s) > 0;
      const same = p ? W.sameMoney(p.currency, s) : true;
      const out = [];

      // 1. What else could it be? Perspective, not a verdict.
      if (p && has && same) {
        askAI();
        const days = W.daysFor(p.price, s);
        const rows = [];
        if (s.goalName && s.goalAmount > 0) {
          const g = Math.round((p.price / s.goalAmount) * 100);
          rows.push([g >= 100 ? "100%+" : g + "%", `of your ${W.goalLabel(s.goalName)}`]);
        }
        if (days >= 2) rows.push([String(Math.floor(days)), "small treats, if each one costs a day of allowance"]);
        const r = aiResult();
        const ideas = r && r.data.ideas && r.data.ideas.length ? r.data.ideas.slice(0, 2) : ["Borrow one, or find it at the library", "Look for a secondhand one"];
        out.push(el("div", { class: "lcard" },
          el("h5", {}, `${W.daysLabel(days)} could also be…`),
          rows.map(([n, t]) => el("div", { class: "alt" }, el("span", { class: "n" }, n), el("span", { class: "t" }, t))),
          el("p", { class: "kicker m", style: "margin:10px 0 4px" }, "Same fun, other ways"),
          el("p", {}, ideas.join(" · "))));
      } else if (!p) {
        return panelLessons(st);
      }

      // 2. Need or want (a quick quiz)
      const quiz = p ? null : QUIZ[Math.floor(now() / 864e5) % QUIZ.length];
      const pick = (v) => { quizPick = v; render(); };
      let ans = null;
      if (quizPick) {
        const base = "Needs are things you can't do without, like food or shoes that fit. Wants are nice to have, and that's okay.";
        ans = quiz
          ? el("div", { class: "ans" }, el("b", {}, (quizPick === "need") === quiz.need ? "Yes! " : "Not quite. "), base)
          : el("div", { class: "ans" }, base + " Would you be fine without it for a month?");
      }
      out.push(card("Need or want?",
        el("p", {}, el("b", {}, p ? shortName(p.name) : quiz.item)),
        el("div", { class: "seg", role: "group", "aria-label": "Need or want" },
          el("button", { "aria-pressed": String(quizPick === "need"), "data-quiz": "need", on: { click: () => pick("need") } }, "A need"),
          el("button", { "aria-pressed": String(quizPick === "want"), "data-quiz": "want", on: { click: () => pick("want") } }, "A want")),
        ans));

      // 3. Saving up: pick how much of the allowance to put aside, see how many weeks it takes
      const target = p && same ? p.price : (s.goalAmount > s.goalSaved ? s.goalAmount - s.goalSaved : 0);
      if (has && target > 0) {
        const cur = s.currency;
        const cents = (x) => Math.round(x * 100) / 100;
        const weekly = cents(W.perWeek(s));
        const weeks = W.weeksToSave(target, s, saveShare);
        const forWhat = p && same ? "" : ` for your ${W.goalLabel(s.goalName)}`;
        out.push(card("How long to save up?",
          el("p", {}, `You get ${W.money(weekly, cur)} a week. How much of it will you save each week?`),
          el("div", { class: "seg money", role: "group", "aria-label": "How much to save each week" },
            [[1, "All of it"], [0.5, "Half"], [0.25, "A quarter"]].map(([v, l]) => el("button", { "aria-pressed": String(saveShare === v), "data-share": String(v), on: { click: () => { saveShare = v; render(); } } },
              el("span", {}, l), el("span", { class: "sa" }, W.money(cents(weekly * v), cur))))),
          el("div", { class: "bigline" }, W.plural(weeks, "week")),
          el("p", { class: "saveres" }, "Save ", el("b", {}, W.money(cents(weekly * saveShare), cur)), " every week and you'll have ", el("b", {}, W.money(target, cur)), `${forWhat} by about ${W.dateInWeeks(weeks)}.`)));
      }

      // 4. Where this fits on the money path, one tap away
      const n = st.done.length;
      out.push(el("button", { class: "pathline", "data-act": "lessons", on: { click: () => { area = "me"; tab = "lessons"; lesson = null; lessonPick = null; lessonView = null; render(); } } },
        el("span", {}, "Your rank: ", el("b", {}, levelFor(n)), ` · ${n} of ${LESSONS.length} lessons`),
        el("span", { class: "go" }, n >= LESSONS.length ? "Review →" : "Next lesson →")));
      return out;
    }

    // ---------------- Better buy: find it cheaper or secondhand ----------------
    // WorthIt's built-in AI works quietly in the background: it picks the shops and search words.

    function aiKey() {
      return (page && page.key) || (product && product.name) || "";
    }

    function askAI() {
      if (!ai || !product) return;
      const key = aiKey();
      if (aiState.has(key)) return;
      aiState.set(key, { status: "loading" });
      const p = product;
      Promise.resolve()
        .then(() => ai({ name: p.name || "", brand: p.brand || "", price: p.price, currency: p.currency || null, context: p.context || null }))
        .then((r) => aiState.set(key, r && r.status ? r : { status: "error" }))
        .catch(() => aiState.set(key, { status: "error" }))
        .then(() => { if ((tab === "better" || tab === "learn") && aiKey() === key) render(); });
    }

    function panelBetter(st) {
      const { s } = st;
      const p = product;
      if (!allows(st, "better")) return [el("p", { class: "kicker" }, "Find it cheaper"), lockCard("Better buy")];
      askAI();
      const state = aiState.get(aiKey());
      const finding = state && state.status === "loading";
      const r = aiResult();
      const shopQuery = (r && r.data.searchQuery) || p.name || "";
      const usedQuery = (r && r.data.secondhandQuery) || p.name || "";
      const kind = r && r.data.kind ? r.data.kind : "general";
      const out = [el("p", { class: "kicker" }, "Find it cheaper"),
        el("p", { class: "lead" }, "The same thing can cost less in another shop. Each button opens that shop's page for it.")];
      if (finding) {
        out.push(el("div", { class: "scanning", "data-finding": "1" }, el("span", { class: "scanbar" }, el("i")), el("span", {}, "Finding the best shops…")));
      } else {
        for (const shop of shopsFor(kind, s.region, page && page.host)) {
          out.push(el("div", { class: "row" },
            el("span", { class: "tx" }, el("b", {}, shop.name), el("small", {}, shop.text)),
            el("a", { class: "act", href: shop.url(encodeURIComponent(shopQuery)), target: "_blank", rel: "noopener noreferrer", "data-link": shop.id, on: { click: (e) => { openLink(e); earn(["bargain", "learned"]); } } }, "Open", icon("out"))));
        }
      }
      out.push(el("p", { class: "kicker g leafk", style: "margin-top:16px" }, "Save the Planet", icon("leaf")),
        el("p", { class: "lead" }, "A used one costs less and keeps a good thing out of the rubbish."));
      for (const l of secondhandLinks(usedQuery, s.region)) {
        out.push(el("div", { class: "row g" },
          el("span", { class: "tx" }, el("b", {}, l.label), el("small", {}, l.text)),

<script>
// WorthIt built-in AI: a small sentence-understanding model (all-MiniLM-L6-v2, 8-bit, about 23 MB)
// that runs on the child's own computer with ONNX Runtime Web (WebAssembly). No server, no downloads.
//
// It turns a product name into a meaning vector and compares it with example phrases for each kind of
// product, so WorthIt knows what kind of thing is on the page. WorthIt then uses its own kid-safe tips and
// ideas for that kind of product, and cleaner search words for Better buy. The AI never writes free text
// to the child: everything the child reads was written by the WorthIt team.
//
// Works as a classic script in the extension service worker, on the website, and in Node for testing.

var WorthItAI = (() => {
  const MAX_TOKENS = 64;
  let ort = null;
  let session = null;
  let vocab = null; // Map token -> id
  let cats = null; // [{ id, label, ideas, tip, vectors: Float32Array[] }]
  let loading = null;

  // ---------------- tokenizer (BERT WordPiece, uncased) ----------------

  function isPunct(ch) {
    const cp = ch.codePointAt(0);
    if ((cp >= 33 && cp <= 47) || (cp >= 58 && cp <= 64) || (cp >= 91 && cp <= 96) || (cp >= 123 && cp <= 126)) return true;
    return /\p{P}/u.test(ch);
  }

  function isCJK(cp) {
    return (cp >= 0x4e00 && cp <= 0x9fff) || (cp >= 0x3400 && cp <= 0x4dbf) || (cp >= 0x20000 && cp <= 0x2a6df) ||
      (cp >= 0x2a700 && cp <= 0x2b73f) || (cp >= 0x2b740 && cp <= 0x2b81f) || (cp >= 0x2b820 && cp <= 0x2ceaf) ||
      (cp >= 0xf900 && cp <= 0xfaff) || (cp >= 0x2f800 && cp <= 0x2fa1f);
  }

  function normalize(text) {
    let out = "";
    for (const ch of String(text || "")) {
      const cp = ch.codePointAt(0);
      if (cp === 0 || cp === 0xfffd || /\p{Cc}/u.test(ch) && !/\s/.test(ch)) continue;
      if (/\s/.test(ch)) { out += " "; continue; }
      out += isCJK(cp) ? ` ${ch} ` : ch;
    }
    // lowercase and strip accents (BERT uncased)
    return out.toLowerCase().normalize("NFD").replace(/\p{Mn}/gu, "");
  }

  function basicTokens(text) {
    const words = [];
    for (const w of normalize(text).split(" ")) {
      if (!w) continue;
      let cur = "";
      for (const ch of w) {
        if (isPunct(ch)) {
          if (cur) words.push(cur);
          words.push(ch);
          cur = "";
        } else cur += ch;
      }
      if (cur) words.push(cur);
    }
    return words;
  }

  function wordPiece(word) {
    if (word.length > 100) return ["[UNK]"];
    const pieces = [];
    let start = 0;
    const chars = Array.from(word);
    while (start < chars.length) {
      let end = chars.length;
      let found = null;
      while (start < end) {
        let sub = chars.slice(start, end).join("");
        if (start > 0) sub = "##" + sub;
        if (vocab.has(sub)) { found = sub; break; }
        end--;
      }
      if (!found) return ["[UNK]"];
      pieces.push(found);
      start = end;
    }
    return pieces;
  }

  function encode(text) {
    const ids = [vocab.get("[CLS]")];
    for (const w of basicTokens(text)) {
      for (const p of wordPiece(w)) {
        if (ids.length >= MAX_TOKENS - 1) break;
        ids.push(vocab.get(p));
      }
    }
    ids.push(vocab.get("[SEP]"));
    return ids;
  }

  // ---------------- model ----------------

  async function init(opts) {
    if (session) return;
    if (loading) return loading;
    loading = (async () => {
      ort = opts.ort;
      ort.env.wasm.numThreads = 1; // no SharedArrayBuffer in extensions or ordinary pages
      if (opts.wasmPaths) ort.env.wasm.wasmPaths = opts.wasmPaths;
      const [vocabList, catData, modelBytes] = await Promise.all([opts.loadJSON("vocab.json"), opts.loadJSON("categories.json"), opts.loadModel()]);
      vocab = new Map(vocabList.map((t, i) => [t, i]));
      cats = catData.categories.map((c) => ({ ...c, vectors: c.vectors.map((v) => Float32Array.from(v)) }));
      session = await ort.InferenceSession.create(modelBytes, { executionProviders: ["wasm"], graphOptimizationLevel: "all" });
    })();
    try {
      await loading;
    } catch (e) {
      loading = null;
      throw e;
    }
  }

  async function embed(text) {
    const ids = encode(text);
    const n = ids.length;
    const big = (a) => BigInt64Array.from(a, (x) => BigInt(x));
    const feeds = {
      input_ids: new ort.Tensor("int64", big(ids), [1, n]),
      attention_mask: new ort.Tensor("int64", big(ids.map(() => 1)), [1, n]),
    };
    if (session.inputNames.includes("token_type_ids")) feeds.token_type_ids = new ort.Tensor("int64", big(ids.map(() => 0)), [1, n]);
    const out = await session.run(feeds);
    const hidden = out.last_hidden_state || out[session.outputNames[0]];
    const dim = hidden.dims[2];
    const data = hidden.data;
    const v = new Float32Array(dim);
    for (let t = 0; t < n; t++) for (let d = 0; d < dim; d++) v[d] += data[t * dim + d];
    let norm = 0;
    for (let d = 0; d < dim; d++) { v[d] /= n; norm += v[d] * v[d]; }
    norm = Math.sqrt(norm) || 1;
    for (let d = 0; d < dim; d++) v[d] /= norm;
    return v;
  }

  function dot(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += a[i] * b[i];
    return s;
  }

  // ---------------- search words ----------------

  const NOISE = /\b(pre-?order|sale|hot|new|best ?seller|free (shipping|delivery|gift)|official|authentic|original|genuine|limited|exclusive|bundle|deal|offer|promo|clearance|in stock|ready stock|local stock|sg stock|instock|fast delivery|singapore|sg)\b/gi;

  function cleanQuery(name, brand) {
    let q = String(name || "")
      .replace(/[\[(【{][^\])】}]*[\])】}]/g, " ") // drop [Pre-Order], (Free Gift) and similar
      .replace(/[*★☆✨🔥|•·]+/gu, " ")
      .replace(NOISE, " ")
      .replace(/\s+-\s+.*$/, " ") // " - Shop name"
      .replace(/\s+/g, " ")
      .trim();
    const words = q.split(" ").filter(Boolean).slice(0, 9);
    q = words.join(" ");
    // Shops often put the distributor or a code in "brand"; only use short, real-looking brand names.
    const b = String(brand || "").trim();
    const usable = b && b.length <= 20 && /[a-z]/i.test(b) && !/\b(pte|ltd|limited|inc|llc|sdn|bhd|co|corp|distribution|distributors?|trading|enterprise|group|holdings)\b/i.test(b);
    if (usable && !q.toLowerCase().includes(b.toLowerCase())) q = `${b} ${q}`;
    return q.slice(0, 90).trim() || String(name || "").slice(0, 90);
  }

  function shortQuery(q) {
    // Secondhand listings are written casually, so fewer words find more.
    return q.split(" ").filter((w) => !/^\d+(\.\d+)?(cm|mm|ml|l|g|kg|pcs|pieces?)?$/i.test(w)).slice(0, 5).join(" ");
  }

  // ---------------- analyse a product ----------------

  async function analyze(req) {
    const name = String(req.name || "").trim();
    const desc = String(req.description || "").split(/(?<=[.!?])\s/)[0].slice(0, 160);
    const text = [name, req.brand, req.category, desc].filter(Boolean).join(". ").slice(0, 400);
    const v = await embed(text || "product");
    let best = null;
    const scores = [];
    for (const c of cats) {
      let s = -1;
      for (const e of c.vectors) s = Math.max(s, dot(v, e));
      scores.push([c.id, Math.round(s * 1000) / 1000]);
      if (!best || s > best.s) best = { c, s };
    }
    scores.sort((a, b) => b[1] - a[1]);
    const general = cats.find((c) => c.id === "general");
    const second = scores[1] ? scores[1][1] : 0;
    // Only name a kind when the model is clearly sure; otherwise use the general tips, which suit anything.
    const sure = best.s >= 0.6 || (best.s >= 0.3 && best.s - second >= 0.04);
    const pick = sure ? best.c : general;

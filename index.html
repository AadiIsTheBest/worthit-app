<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="WorthIt: money lessons for kids.">
<title>WorthIt</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0C0A07">
<style>
  @font-face { font-family: "WorthIt Outfit"; src: url("outfit.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "WorthIt Manrope"; src: url("manrope.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "WorthIt Mono"; src: url("jetbrains-mono.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg: #0B0907; --raise: #14110D; --line: rgba(228,176,74,.16); --line2: rgba(228,176,74,.32);
    --text: #F6F1E7; --mute: #A39887; --faint: #7F7568; --gold: #E4B04A; --gold-hi: #F3D27A; --gold-lo: #C9953B; --green: #8FD1A6;
    --display: "WorthIt Outfit", "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "WorthIt Manrope", "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "WorthIt Mono", "JetBrains Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  .gold-text { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- the entrance: the logo, huge, and one button ---------- */
  .intro { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 4vh, 48px);
    padding: 24px 16px; background: radial-gradient(70% 60% at 50% 45%, #241B0F 0%, #100C08 55%, var(--bg) 100%); overflow: hidden; }
  .intro .logo { width: min(92vw, 1000px, 92vh); height: auto; position: relative; z-index: 1; filter: drop-shadow(0 20px 60px rgba(228,176,74,.25)); }
  .dust i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--gold-hi); opacity: .2; box-shadow: 0 0 8px var(--gold); }
  .enter { position: relative; z-index: 1; border: 0; cursor: pointer; border-radius: 999px; padding: 17px 54px; display: inline-flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); color: #17120A; font: 700 clamp(17px, 2.2vw, 20px) var(--display); letter-spacing: .04em;
    box-shadow: 0 16px 44px rgba(228,176,74,.32), inset 0 1px 0 rgba(255,255,255,.55); transition: transform .3s var(--ease), filter .3s; }
  .enter:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .enter:active { transform: scale(.98); }
  .enter:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 6px; }
  .enter svg { width: 20px; height: 20px; transition: transform .3s var(--ease); }
  .enter:hover svg { transform: translateX(4px); }

  /* ---------- the app: only the extension ---------- */
  .app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: radial-gradient(70% 55% at 50% 0%, #1A140C 0%, var(--bg) 70%); }
  .dev { position: relative; flex: 0 1 440px; min-width: 0; width: 100%; max-width: 440px; height: min(880px, calc(100dvh - 48px)); background: var(--bg); border: 1px solid var(--line); border-radius: 30px; overflow: hidden;
    box-shadow: 0 50px 120px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(0,0,0,.6), 0 0 80px -20px rgba(228,176,74,.12); }
  @media (max-width: 520px) { .app { padding: 0; } .dev { max-width: none; height: 100%; border: 0; border-radius: 0; box-shadow: none; } }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .scr.leaving { pointer-events: none; z-index: 1; }
  .scr:not(.leaving) { z-index: 2; }
  .ph { position: absolute; inset: 0; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; flex: 0 0 auto; position: relative; z-index: 2; }
  .bar h1 { margin: 0; font: 600 17px var(--display); letter-spacing: .01em; }
  .bar .sp { flex: 1; }
  .ico { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--mute); display: grid; place-items: center; cursor: pointer; transition: color .2s, border-color .2s, transform .3s var(--ease); }
  .ico:hover { color: var(--gold-hi); border-color: var(--line2); }
  .ico svg { width: 17px; height: 17px; }
  .body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 90px; display: flex; flex-direction: column; align-items: center; }

  /* launch page: the WorthIt start screen, refined */
  .home .body { justify-content: center; padding-top: 0; text-align: center; gap: 0; }
  .sky { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(80% 50% at 50% 30%, rgba(228,176,74,.12), transparent 70%); }
  .home .mark { width: 128px; height: auto; filter: drop-shadow(0 14px 34px rgba(228,176,74,.35)); }
  .home h2 { margin: 6px 0 0; font: 800 38px var(--display); letter-spacing: -.035em; }
  .home .hi { margin: 4px 0 0; font: 500 19px var(--display); color: var(--text); }
  .rank { display: flex; flex-direction: column; align-items: center; gap: 7px; margin: 16px 0 0; }
  .rank .rl { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-hi);
    border: 1px solid var(--line2); border-radius: 999px; padding: 6px 14px; background: linear-gradient(180deg, rgba(228,176,74,.12), rgba(228,176,74,.03)); }
  .rank .rb { width: 170px; height: 3px; border-radius: 99px; background: rgba(228,176,74,.14); overflow: hidden; }
  .rank .rb i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); border-radius: 99px; }
  .rank .rn { font-size: 11.5px; color: var(--faint); letter-spacing: .02em; }
  .tagline { margin: 16px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--mute); max-width: 30ch; }
  .choices { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 310px; }
  .pill { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; border-radius: 999px; padding: 14px 22px; cursor: pointer; transition: transform .3s var(--ease), box-shadow .3s, border-color .3s, filter .3s; }
  .pill .lt { font: 700 17px var(--display); letter-spacing: .01em; }
  .pill .ls { font: 500 11.5px var(--body); opacity: .72; }
  .pill.gold { border: 0; color: #17120A; background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); box-shadow: 0 14px 38px rgba(228,176,74,.3), inset 0 1px 0 rgba(255,255,255,.55); }
  .pill.dark { border: 1px solid var(--line2); color: var(--text); background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)); }
  .pill:hover { transform: translateY(-2px); }
  .pill.gold:hover { filter: brightness(1.05); box-shadow: 0 18px 44px rgba(228,176,74,.4), inset 0 1px 0 rgba(255,255,255,.55); }
  .pill.dark:hover { border-color: var(--gold); box-shadow: 0 10px 30px rgba(228,176,74,.12); }
  .pill:active { transform: scale(.98); }
  .minirow { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 18px; }
  .link { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--faint); font: 500 12.5px var(--body); cursor: pointer; padding: 6px 2px; transition: color .2s; }
  .link:hover { color: var(--gold-hi); }
  .link svg { width: 13px; height: 13px; }

  .hp { width: 112px; height: 112px; flex: 0 0 auto; }
  .bub { position: relative; max-width: 340px; background: linear-gradient(180deg, #1C1712, #141009); border: 1px solid var(--line2); border-radius: 18px; padding: 12px 18px; text-align: center;
    font: 500 16px/1.45 var(--display); margin: 10px 0 18px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .bub::before { content: ""; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; margin-left: -6px; background: #1C1712; border-left: 1px solid var(--line2); border-top: 1px solid var(--line2); transform: rotate(45deg); }
  .bub b { color: var(--gold-hi); font-weight: 600; }

  .form { width: 100%; max-width: 360px; display: grid; gap: 10px; }
  input.in, select.in { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.02); border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 14px 16px; font: 500 16px var(--display); transition: border-color .2s, box-shadow .2s; }
  input.in:focus, select.in:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(228,176,74,.12); }
  .money { position: relative; }
  .money .cur { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gold-hi); font: 600 16px var(--display); pointer-events: none; }
  .money .in { padding-left: 50px; }
  .btn { border: 0; border-radius: 999px; padding: 15px; font: 700 16px var(--display); letter-spacing: .02em; cursor: pointer; color: #17120A; background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo));
    box-shadow: 0 12px 32px rgba(228,176,74,.28), inset 0 1px 0 rgba(255,255,255,.55); transition: transform .3s var(--ease), filter .3s, opacity .3s; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
  .btn:disabled { opacity: .3; cursor: default; box-shadow: none; }
  .btn.ghost { background: rgba(255,255,255,.02); color: var(--text); border: 1px solid var(--line2); box-shadow: none; font-weight: 600; font-size: 14px; padding: 13px; }
  .btn.ghost:hover { border-color: var(--gold); }
  .btn.warn { color: #E9A38F; border-color: rgba(233,163,143,.35); }
  .klbl { font: 600 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 22px auto 10px; width: 100%; max-width: 360px; }
  .tries { width: 100%; max-width: 360px; display: grid; gap: 8px; }
  .try { display: flex; align-items: center; gap: 12px; text-align: left; background: rgba(255,255,255,.02); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 10px 14px; cursor: pointer; font-family: inherit; transition: border-color .25s, transform .3s var(--ease), background .25s; }
  .try:hover { border-color: var(--line2); background: rgba(228,176,74,.04); transform: translateX(3px); }
  .try .e { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: radial-gradient(circle at 35% 30%, rgba(243,210,122,.22), rgba(228,176,74,.05)); border: 1px solid var(--line); flex: 0 0 auto; }
  .try b { flex: 1; font: 600 14px var(--body); }
  .try span.p { font: 600 14px var(--display); color: var(--gold-hi); }

  .fields { width: 100%; max-width: 380px; display: grid; gap: 12px; }
  .fld { display: grid; gap: 6px; font-size: 12.5px; color: var(--mute); }
  .fld em { font-style: normal; color: var(--faint); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }
  select.in { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  .fld .in { font-size: 15px; padding: 11px 13px; }
  .card { width: 100%; max-width: 380px; background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-sizing: border-box; margin-bottom: 12px; }
  .card h2 { margin: 0 0 4px; font: 600 16px var(--display); }
  .card p { margin: 0 0 12px; font-size: 12.5px; color: var(--mute); line-height: 1.5; }
  .ok { color: var(--green); font-weight: 700; font-size: 13px; min-height: 18px; text-align: center; }
  .fine { font-size: 11.5px; color: var(--faint); text-align: center; line-height: 1.6; max-width: 360px; }
  .fine a { color: var(--mute); }
  .flash { box-shadow: 0 0 0 3px var(--gold) !important; }

  /* Penny's chat slides up as a sheet */
  .shade { position: absolute; inset: 0; z-index: 19; background: rgba(5,4,3,.6); backdrop-filter: blur(2px); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 84%; z-index: 20; background: linear-gradient(180deg, #16120D, #0E0B08); border-top: 1px solid var(--line2); border-radius: 28px 28px 0 0; padding: 24px 16px 16px; display: flex; flex-direction: column; box-shadow: 0 -20px 60px rgba(0,0,0,.6); }
  .sheet::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 99px; background: var(--line2); }
  .sheet .pn { height: 100%; }
  .dev .scr > .penny-help { left: 18px; bottom: 18px; width: 50px; height: 50px; z-index: 15; }

  /* the guided tour: a spotlight, a ring and Penny's card */
  .coach { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
  .coach-mask { position: absolute; inset: 0; background: rgba(5,4,3,.74); pointer-events: auto; transition: clip-path .5s var(--ease), opacity .4s; }
  .coach-ring { position: absolute; border-radius: 18px; box-shadow: 0 0 0 2px var(--gold), 0 0 0 7px rgba(228,176,74,.18), 0 0 40px rgba(228,176,74,.45); transition: all .5s var(--ease); pointer-events: none; }
  .coach-card { position: absolute; left: 16px; right: 16px; max-width: 380px; margin: 0 auto; pointer-events: auto; background: linear-gradient(180deg, #1D1812, #120E0A); border: 1px solid var(--line2); border-radius: 20px; padding: 14px 16px 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 40px -10px rgba(228,176,74,.25); transition: top .5s var(--ease), opacity .3s; }
  .coach-card .hd { display: flex; align-items: center; gap: 10px; }
  .coach-card .fc { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--gold); overflow: hidden; }
  .coach-card .ti { font: 600 16px var(--display); flex: 1; }
  .coach-card .ct { font: 600 10.5px var(--mono); letter-spacing: .12em; color: var(--faint); }
  .coach-card p { margin: 9px 0 0; font-size: 14px; line-height: 1.55; color: #E8E0D2; }
  .coach-card p b { color: var(--gold-hi); font-weight: 700; }
  .coach-card .ft { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .coach-card .dots { display: flex; gap: 5px; flex: 1; }
  .coach-card .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(228,176,74,.2); transition: all .3s; }
  .coach-card .dots i.on { width: 18px; border-radius: 99px; background: var(--gold); }
  .coach-card .nx { border: 0; border-radius: 999px; padding: 9px 18px; font: 700 13.5px var(--display); color: #17120A; background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); cursor: pointer; }
  .coach-card .tap { font: 600 12.5px var(--display); color: var(--gold-hi); display: inline-flex; align-items: center; gap: 6px; }
  .coach-card .tap i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(228,176,74,.6); }
  .coach-card .sk { background: none; border: 0; color: var(--faint); font: 500 12px var(--body); cursor: pointer; padding: 6px; }
  .coach-card .sk:hover { color: var(--text); }
  .coach.final .coach-card { text-align: center; padding: 20px 20px 18px; }
  .coach.final .bigp { width: 120px; height: 120px; margin: 0 auto 4px; }
  .coach.final .coach-card .ti { display: block; font-size: 22px; }

  /* the WorthIt start-up */
  .launch { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden;
    background: radial-gradient(60% 45% at 50% 42%, #2A1F10 0%, #0B0907 70%); clip-path: circle(150% at var(--x) var(--y)); }
  .launch .lm { width: 150px; position: relative; z-index: 2; filter: drop-shadow(0 0 40px rgba(228,176,74,.55)); }
  .launch .ln { font: 800 34px var(--display); letter-spacing: -.03em; position: relative; z-index: 2; }
  .launch .lbar { width: 160px; height: 3px; border-radius: 99px; background: rgba(228,176,74,.15); overflow: hidden; margin-top: 10px; position: relative; z-index: 2; }
  .launch .lbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); border-radius: 99px; }
  .launch .lt { font: 600 10.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--gold-hi); position: relative; z-index: 2; min-height: 14px; }
  .launch .lring { position: absolute; left: 50%; top: 42%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; border: 1.5px solid rgba(243,210,122,.6); box-shadow: 0 0 40px rgba(228,176,74,.4); }
  .launch .rain i { position: absolute; top: -20px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF1BF, #E4B04A 55%, #9A6F1E); box-shadow: 0 0 10px rgba(228,176,74,.5); transform: scale(var(--s)); opacity: 0; }
  .launch.out { animation: fade-out .6s ease forwards; }
  .pill.invite { box-shadow: 0 0 0 0 rgba(228,176,74,.55), 0 14px 38px rgba(228,176,74,.3), inset 0 1px 0 rgba(255,255,255,.55); }
  .scr.fromlaunch { animation: none !important; }


  /* sign up, plan, demo shop */
  .dev.touring .penny-help { display: none !important; }
  .auth .body, .scr.plan .body { justify-content: center; text-align: center; }
  .scr.plan .body > .btn { width: 100%; max-width: 330px; }
  .mark.sm { width: 92px; height: auto; filter: drop-shadow(0 12px 30px rgba(228,176,74,.35)); }
  .auth h2 { margin: 4px 0 0; font: 800 32px var(--display); letter-spacing: -.035em; }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid var(--line); margin: 18px 0 14px; background: rgba(255,255,255,.02); }
  .seg button { border: 0; background: transparent; color: var(--mute); border-radius: 999px; padding: 8px 20px; font: 600 13.5px var(--display); cursor: pointer; transition: all .3s var(--ease); }
  .seg button[aria-pressed="true"] { background: linear-gradient(180deg, #F5D686, var(--gold) 55%, var(--gold-lo)); color: #17120A; }
  .authf { text-align: left; }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--mute); line-height: 1.5; cursor: pointer; }
  .agree input { margin-top: 3px; accent-color: #E4B04A; width: 16px; height: 16px; flex: 0 0 auto; }
  .agree a { color: var(--gold-hi); }
  .err { margin: 0; min-height: 16px; color: #E9A38F; font-size: 12.5px; font-weight: 600; }
  .shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 20%, 80% { transform: translateX(-3px); } 40%, 60% { transform: translateX(6px); } 50% { transform: translateX(-6px); } }
  .ptitle { margin: 0 0 14px; font: 700 23px var(--display); letter-spacing: -.02em; }
  .tline { width: 100%; max-width: 330px; display: grid; gap: 2px; text-align: left; margin-bottom: 16px; position: relative; }
  .trow { display: flex; gap: 12px; padding: 7px 0; animation: rise .7s var(--ease) both; }
  .trow i { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; background: var(--gold); box-shadow: 0 0 0 4px rgba(228,176,74,.15); }
  .trow:last-child i { background: transparent; border: 2px solid var(--gold); box-shadow: none; }
  .trow b { display: block; font: 600 14.5px var(--display); }
  .trow span { font-size: 12.5px; color: var(--mute); }
  .plans { width: 100%; max-width: 330px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .tier { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--text); cursor: pointer; text-align: left; transition: all .3s var(--ease); }
  .tier.on { border-color: var(--gold); background: linear-gradient(180deg, rgba(228,176,74,.14), rgba(228,176,74,.03)); box-shadow: 0 0 0 1px rgba(228,176,74,.35), 0 10px 30px rgba(228,176,74,.12); }
  .tier .pn { font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .tier .pp { font: 700 24px var(--display); } .tier .pp small { font: 500 12px var(--body); color: var(--mute); margin-left: 2px; }
  .tier .px { font-size: 11.5px; color: var(--faint); }
  .tier .best { position: absolute; top: -9px; right: 10px; font: 700 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: #17120A; border-radius: 99px; padding: 3px 8px; }
  .link.center { margin: 10px auto 6px; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; }
  .co { height: auto; padding: 26px 22px 22px; display: grid; gap: 10px; }
  .co h3 { margin: 0; font: 700 22px var(--display); }
  .co .cop { margin: 0; font: 800 30px var(--display); color: var(--gold-hi); }
  .co ul { margin: 0; padding-left: 18px; color: #E0D7C8; font-size: 13.5px; line-height: 1.7; }

<body>
<section class="intro" id="intro" aria-label="WorthIt">
  <div class="dust" aria-hidden="true" id="dust"></div>
  <img class="logo" src="logo.webp" alt="WorthIt" width="990" height="747">
  <button class="enter" id="enter" type="button">Enter <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</section>
<main class="app" id="app" hidden><div class="dev" id="dev"></div></main>

<script>
// WorthIt shared helpers: used by the page panel, the toolbar popup and the grown-up settings page.
// Everything here is pure maths and formatting. No network, no tracking.

var WorthIt = (() => {
  const PERIOD_DAYS = { day: 1, week: 7, month: 30.4 };
  const MONTH_DAYS = 30.4;
  const SYMBOLS = { SGD: "S$", USD: "US$", MYR: "RM", AUD: "A$", HKD: "HK$", GBP: "£", EUR: "€", INR: "₹" };

  // Every key WorthIt ever stores, all in chrome.storage.local on this computer.
  const SETTINGS_KEYS = ["amount", "period", "name", "currency", "region", "waitDays", "enabled", "goalName", "goalAmount", "goalSaved", "aiEnabled", "nanoEnabled", "age"];
  const DATA_KEYS = ["wishlist", "collapsed"];

  const DEFAULTS = {
    amount: 0,
    period: "week",
    name: "",
    currency: "SGD",
    region: "SG",
    waitDays: 3,
    enabled: true,
    goalName: "",
    goalAmount: 0,
    goalSaved: 0,
    aiEnabled: true,
    nanoEnabled: false,
  };

  function perDay(settings) {
    const amount = Number(settings.amount) || 0;
    return amount / (PERIOD_DAYS[settings.period] || 7);
  }

  function perWeek(settings) {
    return perDay(settings) * 7;
  }

  function perMonth(settings) {
    return perDay(settings) * MONTH_DAYS;
  }

  function daysFor(price, settings) {
    const pd = perDay(settings);
    return pd > 0 ? price / pd : null;
  }

  function roundDays(days) {
    if (days == null) return null;
    if (days < 10) return Math.max(0.1, Math.round(days * 10) / 10);
    return Math.round(days);
  }

  function daysLabel(days) {
    const r = roundDays(days);
    return `${r} ${r === 1 ? "day" : "days"}`;
  }

  function plural(n, word) {
    return `${n} ${n === 1 ? word : word + "s"}`;
  }

  // A friendly, concrete comparison a young child can picture.
  function contextLine(days) {
    if (days == null) return "";
    if (days < 1) return "That's less than one day of allowance.";
    if (days < 7) return "That's less than a week of saving.";
    if (days < 8) return "That's about a week of saving.";
    if (days < 14) return "That's more than a week of saving.";
    if (days < 60) return `That's about ${Math.round(days / 7)} weeks of saving.`;
    if (days < 365) return `That's about ${Math.round(days / MONTH_DAYS)} months of saving.`;
    const y = Math.round((days / 365) * 10) / 10;
    return `That's about ${y} ${y === 1 ? "year" : "years"} of saving.`;
  }

  function money(price, currency) {
    const sym = SYMBOLS[(currency || "").toUpperCase()] || "$";
    const n = Number(price) || 0;
    const hasCents = Math.round(n * 100) % 100 !== 0;
    return sym + n.toLocaleString("en-US", {
      minimumFractionDigits: hasCents ? 2 : 0,
      maximumFractionDigits: 2,
    });
  }

  function whose(settings) {
    return settings.name ? `${settings.name}'s` : "your";
  }

  function withDefaults(s) {
    const out = Object.assign({}, DEFAULTS, s || {});
    out.goalAmount = Number(out.goalAmount) || 0;
    out.goalSaved = Number(out.goalSaved) || 0;
    out.waitDays = Number(out.waitDays) || 3;
    return out;
  }

  function sameMoney(currency, settings) {
    return !currency || String(currency).toUpperCase() === String(settings.currency || "SGD").toUpperCase();
  }

  // Weeks needed to afford a price if the child puts aside `share` (0..1) of their allowance.
  function weeksToSave(price, settings, share) {
    const weekly = perWeek(settings) * share;
    if (!(weekly > 0)) return null;
    return Math.max(1, Math.ceil(price / weekly));
  }

  function dateInWeeks(weeks) {
    const d = new Date(Date.now() + weeks * 7 * 864e5);
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "long" });
  }

  // Totals of what the child kept by thinking it over. Only amounts in the family's own money are added up.
  function keptTotals(choices, settings) {
    const t = { total: 0, skip: 0, swap: 0, count: 0 };
    for (const c of choices || []) {
      if (!(c.amount > 0) || !sameMoney(c.currency, settings)) continue;
      t.total += c.amount;
      if (c.kind === "skip") t.skip += c.amount;
      else t.swap += c.amount;
      t.count++;
    }
    return t;
  }

  // "a new bike" -> "new bike", so sentences can say "your new bike".
  function goalLabel(name) {
    return String(name || "").trim().replace(/^(a|an|the|my|your|some)\s+/i, "") || "goal";
  }

  function hashIndex(str, n) {
    let h = 0x811c9dc5;
    const s = String(str || "");
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0) % n;
  }

  return {
    PERIOD_DAYS, MONTH_DAYS, SYMBOLS, SETTINGS_KEYS, DATA_KEYS, DEFAULTS,
    perDay, perWeek, perMonth, daysFor, roundDays, daysLabel, plural, contextLine, money, whose,
    withDefaults, sameMoney, weeksToSave, dateInWeeks, keptTotals, goalLabel, hashIndex,
  };
})();

// WorthIt badges, learning streak and Starter Quest.
// Rewards thinking, waiting and learning, never buying. No leaderboards, no comparing with other children.
// Everything is saved in chrome.storage.local on this computer under the key "quest".

var WorthItQuest = (() => {
  const BADGES = [
    { id: "promise", icon: "🤝", name: "Money Promise", did: "You promised to think before you buy.", how: "Make your money promise when you set up WorthIt." },
    { id: "firstLook", icon: "👀", name: "First Look", did: "You looked at a price in days.", how: "Launch WorthIt on a shopping page." },
    { id: "curious", icon: "💡", name: "Curious Mind", did: "You checked what else that money could be.", how: "Open Learn to see what else a price could be." },
    { id: "thinker", icon: "🤔", name: "Big Thinker", did: "You saved it to think it over.", how: "Save something to your wish list to think it over." },
    { id: "patient", icon: "⏳", name: "Patient Pocket", did: "You waited before deciding.", how: "Wait out the think-it-over days, then decide." },
    { id: "changedMind", icon: "🔄", name: "Changed My Mind", did: "You thought it over and changed your mind. Smart!", how: "Decide you don't need something after all." },
    { id: "bargain", icon: "🔍", name: "Bargain Hunter", did: "You looked for a better price.", how: "Look for the same thing cheaper in Better buy." },
    { id: "planetPal", icon: "🌱", name: "Planet Pal", did: "You looked for it secondhand.", how: "Look for it secondhand with Save the Planet." },
    { id: "learner", icon: "📘", name: "First Lesson", did: "You finished your first lesson.", how: "Finish your first money lesson." },
    { id: "smartSaver", icon: "🐷", name: "Smart Saver", did: "You finished 3 lessons.", how: "Finish 3 money lessons." },
    { id: "master", icon: "👑", name: "Money Master", did: "You finished every lesson!", how: "Finish all 8 money lessons." },
    { id: "streak3", icon: "🔥", name: "3-Day Streak", did: "3 days in a row!", how: "Learn or think it over 3 days in a row." },
    { id: "streak7", icon: "🌟", name: "7-Day Streak", did: "7 days in a row!", how: "Learn or think it over 7 days in a row." },
    { id: "questDone", icon: "🏆", name: "Quest Champion", did: "You finished the Starter Quest!", how: "Finish the Starter Quest." },
  ];

  // The Starter Quest: the first few things every new WorthIt kid does.
  const QUEST = [
    { id: "setup", text: "A grown-up sets your allowance", done: (st) => st.hasAllowance },
    { id: "firstLook", text: "Launch WorthIt on a shopping page", done: (st) => !!st.badges.firstLook },
    { id: "curious", text: "Peek at Learn: what else could it be?", done: (st) => !!st.badges.curious },
    { id: "thinker", text: "Save something to your wish list", done: (st) => !!st.badges.thinker },
    { id: "learner", text: "Finish your first money lesson", done: (st) => !!st.badges.learner },
  ];

  function today(now) {
    const d = new Date(now || Date.now());
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function dayNum(iso) { const [y, m, d] = iso.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }

  function clean(raw) {
    const q = raw && typeof raw === "object" ? raw : {};
    return {
      badges: q.badges && typeof q.badges === "object" ? q.badges : {},
      days: Array.isArray(q.days) ? q.days.filter((x) => /^\d{4}-\d{2}-\d{2}$/.test(x)).slice(-30) : [],
      best: Number(q.best) || 0,
      seen: q.seen && typeof q.seen === "object" ? q.seen : {},
    };
  }

  // Days in a row ending today (or yesterday, so a streak isn't lost before the child has had a chance today).
  function streak(q, now) {
    const set = new Set(q.days.map(dayNum));
    let t = dayNum(today(now));
    if (!set.has(t)) t -= 1;
    let n = 0;
    while (set.has(t)) { n++; t--; }
    return n;
  }

  function status(raw, settings, now) {
    const q = clean(raw);
    const st = { badges: q.badges, hasAllowance: Number(settings && settings.amount) > 0 };
    const steps = QUEST.map((s) => ({ id: s.id, text: s.text, done: !!s.done(st) }));
    return { q, steps, questDone: steps.every((s) => s.done), streak: streak(q, now), best: q.best, earned: BADGES.filter((b) => q.badges[b.id]).length };
  }

  // Record events. Returns the badges newly earned, so the panel can celebrate them.
  async function record(store, events, opts = {}) {
    const raw = await store.get(["quest", "amount"]);
    const q = clean(raw.quest);
    const now = opts.now ? opts.now() : Date.now();
    const fresh = [];
    const give = (id) => { if (!q.badges[id] && BADGES.some((b) => b.id === id)) { q.badges[id] = now; fresh.push(id); } };
    for (const e of [].concat(events || [])) {
      if (e === "learned") {
        const t = today(now);
        if (!q.days.includes(t)) q.days = [...q.days, t].slice(-30);
      } else give(e);
    }
    if (opts.lessonsDone != null) {
      if (opts.lessonsDone >= 1) give("learner");
      if (opts.lessonsDone >= 3) give("smartSaver");
      if (opts.lessonsDone >= 8) give("master");
    }
    const s = streak(q, now);
    q.best = Math.max(q.best, s);
    if (s >= 3) give("streak3");
    if (s >= 7) give("streak7");
    if (status(q, { amount: raw.amount }, now).questDone) give("questDone");
    await store.set({ quest: q });
    return fresh.map((id) => BADGES.find((b) => b.id === id));
  }

  function badge(id) { return BADGES.find((b) => b.id === id); }

  return { BADGES, QUEST, status, record, badge, today };
})();

// WorthIt family plan: a free first week, then the family plan unlocks the full version.
//
// PAYMENTS_ENABLED stays false until the WorthIt team has a payment provider set up
// (see the README). While it is false, everything is free and nothing is ever locked.
//
// The free week needs no sign-up and no card: the install date is saved on this computer,
// and nothing is charged automatically when the week ends. A parent chooses to subscribe.

var WorthItPlan = (() => {
  const PAYMENTS_ENABLED = true; // the web app shows the free week and the family plan
  const TRIAL_DAYS = 7;
  const PRICE_LABEL = "S$4 a month";
  const FREE_LESSONS = 3; // lessons 1-3 stay free for everyone, always

  // What stays free after the free week: prices in days, the wish list, Learn, lessons 1-3, badges and the quest.
  // What the family plan unlocks: Better buy with the AI and Save the Planet, and lessons 4-8.
  const PREMIUM = ["better", "lessonsAll"];

  function state(raw, now) {
    const t = now || Date.now();
    const installedAt = Number(raw && raw.installedAt) || t;
    const paid = !!(raw && raw.planActive);
    const daysLeft = Math.max(0, Math.ceil(TRIAL_DAYS - (t - installedAt) / 864e5));
    if (!PAYMENTS_ENABLED) return { mode: "free", locked: false, daysLeft, paid };
    if (paid) return { mode: "paid", locked: false, daysLeft, paid };
    if (daysLeft > 0) return { mode: "trial", locked: false, daysLeft, paid };
    return { mode: "ended", locked: true, daysLeft: 0, paid };
  }

  function allows(st, feature) {
    return !st.locked || !PREMIUM.includes(feature);
  }

  return { PAYMENTS_ENABLED, TRIAL_DAYS, PRICE_LABEL, FREE_LESSONS, PREMIUM, state, allows };
})();

  const LEVELS = [[0, "Coin Starter"], [3, "Smart Saver"], [6, "Money Planner"], [8, "Money Master"]];

  function el(tag, attrs, ...kids) {

  function shopsFor(kind, region, pageHost) {

    const out = [];
    for (const id of ids) {
      const shop = SHOPS[id];
      if (!shop || seen.has(shop.name) || (here && (here === shop.host || here.endsWith("." + shop.host)))) continue;
      seen.add(shop.name);
      out.push({ id, ...shop });
      if (out.length === 3) break;
    }
    return out;
  }

  function create(opts) {

    // ---------------- Better buy: find it cheaper or secondhand ----------------

    function helpButton() {

    let renderSeq = 0;

      if (helpOv) wrap.append(helpOv); // keep Penny open while the panel refreshes

        if (target) { const tb = target.getBoundingClientRect(), bb = body.getBoundingClientRect(); if (tb.bottom > bb.bottom) body.scrollTop += tb.bottom - bb.bottom + 12; }
      }
    }

    // Start-up screen: shown once when the panel is launched.
    function boot() {
      const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ms = reduce ? 300 : 1150;
      const text = el("div", { class: "bt" }, "Counting the coins…");
      const rain = el("div", { class: "coinrain", "aria-hidden": "true" });
      if (!reduce) for (let i = 0; i < 14; i++) rain.append(el("i", { style: `left:${4 + ((i * 37) % 92)}%;animation-delay:${(i % 7) * 90}ms` }));
      const ov = el("div", { class: "boot", role: "status", "aria-label": "WorthIt is starting", style: `--boot-ms:${ms}ms` },

        el("div", { class: "bb" }, el("i")), text);

      steps.forEach((t, i) => setTimeout(() => { text.textContent = t; }, (ms / steps.length) * i));
      setTimeout(() => { ov.classList.add("out"); setTimeout(() => ov.remove(), 380); }, ms + 120);
    }

    render();
    if (opts.boot) boot();

    return {
      render,
      setProduct(p, pg) { product = p; if (pg) page = pg; if (pageLike) { area = "item"; tab = "cost"; } lesson = null; quizPick = null; render(); },
      openHelp,
      setTab(t) { tab = t; area = t === "wish" || t === "lessons" || t === "badges" ? "me" : "item"; lesson = null; render(); },
      destroy() { destroyed = true; wrap.remove(); },
    };
  }

  return { create, CSS, FONT, shopsFor, secondhandLinks, LESSON_COUNT: LESSONS.length, levelFor, LEVELS };
})();

<script>
// WorthIt built-in AI: a small sentence-understanding model (all-MiniLM-L6-v2, 8-bit, about 23 MB)
// that runs on the child's own computer with ONNX Runtime Web (WebAssembly). No server, no downloads.
//
// It turns a product name into a meaning vector and compares it with example phrases for each kind of
// product, so WorthIt knows what kind of thing is on the page. WorthIt then uses its own kid-safe tips and
// ideas for that kind of product, and cleaner search words for Better buy. The AI never writes free text
// to the child: everything the child reads was written by the WorthIt team.
//
// Works as a classic script in the extension service worker, on the website, and in Node for testing.

var WorthItAI = (() => {
  const MAX_TOKENS = 64;
  let ort = null;
  let session = null;
  let vocab = null; // Map token -> id
  let cats = null; // [{ id, label, ideas, tip, vectors: Float32Array[] }]
  let loading = null;

  // ---------------- tokenizer (BERT WordPiece, uncased) ----------------

  function isPunct(ch) {
    const cp = ch.codePointAt(0);
    if ((cp >= 33 && cp <= 47) || (cp >= 58 && cp <= 64) || (cp >= 91 && cp <= 96) || (cp >= 123 && cp <= 126)) return true;
    return /\p{P}/u.test(ch);
  }

  function isCJK(cp) {
    return (cp >= 0x4e00 && cp <= 0x9fff) || (cp >= 0x3400 && cp <= 0x4dbf) || (cp >= 0x20000 && cp <= 0x2a6df) ||
      (cp >= 0x2a700 && cp <= 0x2b73f) || (cp >= 0x2b740 && cp <= 0x2b81f) || (cp >= 0x2b820 && cp <= 0x2ceaf) ||
      (cp >= 0xf900 && cp <= 0xfaff) || (cp >= 0x2f800 && cp <= 0x2fa1f);
  }

  function normalize(text) {
    let out = "";
    for (const ch of String(text || "")) {
      const cp = ch.codePointAt(0);
      if (cp === 0 || cp === 0xfffd || /\p{Cc}/u.test(ch) && !/\s/.test(ch)) continue;
      if (/\s/.test(ch)) { out += " "; continue; }
      out += isCJK(cp) ? ` ${ch} ` : ch;
    }
    // lowercase and strip accents (BERT uncased)
    return out.toLowerCase().normalize("NFD").replace(/\p{Mn}/gu, "");
  }

  function basicTokens(text) {
    const words = [];
    for (const w of normalize(text).split(" ")) {
      if (!w) continue;
      let cur = "";
      for (const ch of w) {
        if (isPunct(ch)) {
          if (cur) words.push(cur);
          words.push(ch);
          cur = "";
        } else cur += ch;
      }
      if (cur) words.push(cur);
    }
    return words;
  }

  function wordPiece(word) {
    if (word.length > 100) return ["[UNK]"];
    const pieces = [];
    let start = 0;
    const chars = Array.from(word);
    while (start < chars.length) {
      let end = chars.length;
      let found = null;
      while (start < end) {
        let sub = chars.slice(start, end).join("");
        if (start > 0) sub = "##" + sub;
        if (vocab.has(sub)) { found = sub; break; }
        end--;
      }
      if (!found) return ["[UNK]"];
      pieces.push(found);
      start = end;
    }
    return pieces;
  }

  function encode(text) {
    const ids = [vocab.get("[CLS]")];
    for (const w of basicTokens(text)) {
      for (const p of wordPiece(w)) {
        if (ids.length >= MAX_TOKENS - 1) break;
        ids.push(vocab.get(p));
      }
    }
    ids.push(vocab.get("[SEP]"));
    return ids;
  }

  // ---------------- model ----------------

  async function init(opts) {
    if (session) return;
    if (loading) return loading;
    loading = (async () => {
      ort = opts.ort;
      ort.env.wasm.numThreads = 1; // no SharedArrayBuffer in extensions or ordinary pages
      if (opts.wasmPaths) ort.env.wasm.wasmPaths = opts.wasmPaths;
      const [vocabList, catData, modelBytes] = await Promise.all([opts.loadJSON("vocab.json"), opts.loadJSON("categories.json"), opts.loadModel()]);
      vocab = new Map(vocabList.map((t, i) => [t, i]));
      cats = catData.categories.map((c) => ({ ...c, vectors: c.vectors.map((v) => Float32Array.from(v)) }));
      session = await ort.InferenceSession.create(modelBytes, { executionProviders: ["wasm"], graphOptimizationLevel: "all" });
    })();
    try {
      await loading;
    } catch (e) {
      loading = null;
      throw e;
    }
  }

  async function embed(text) {
    const ids = encode(text);
    const n = ids.length;
    const big = (a) => BigInt64Array.from(a, (x) => BigInt(x));
    const feeds = {
      input_ids: new ort.Tensor("int64", big(ids), [1, n]),
      attention_mask: new ort.Tensor("int64", big(ids.map(() => 1)), [1, n]),
    };
    if (session.inputNames.includes("token_type_ids")) feeds.token_type_ids = new ort.Tensor("int64", big(ids.map(() => 0)), [1, n]);
    const out = await session.run(feeds);
    const hidden = out.last_hidden_state || out[session.outputNames[0]];
    const dim = hidden.dims[2];
    const data = hidden.data;
    const v = new Float32Array(dim);
    for (let t = 0; t < n; t++) for (let d = 0; d < dim; d++) v[d] += data[t * dim + d];
    let norm = 0;
    for (let d = 0; d < dim; d++) { v[d] /= n; norm += v[d] * v[d]; }
    norm = Math.sqrt(norm) || 1;
    for (let d = 0; d < dim; d++) v[d] /= norm;
    return v;
  }

  function dot(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += a[i] * b[i];
    return s;
  }

  // ---------------- search words ----------------

  const NOISE = /\b(pre-?order|sale|hot|new|best ?seller|free (shipping|delivery|gift)|official|authentic|original|genuine|limited|exclusive|bundle|deal|offer|promo|clearance|in stock|ready stock|local stock|sg stock|instock|fast delivery|singapore|sg)\b/gi;

  function cleanQuery(name, brand) {
    let q = String(name || "")
      .replace(/[\[(【{][^\])】}]*[\])】}]/g, " ") // drop [Pre-Order], (Free Gift) and similar
      .replace(/[*★☆✨🔥|•·]+/gu, " ")
      .replace(NOISE, " ")
      .replace(/\s+-\s+.*$/, " ") // " - Shop name"
      .replace(/\s+/g, " ")
      .trim();
    const words = q.split(" ").filter(Boolean).slice(0, 9);
    q = words.join(" ");
    // Shops often put the distributor or a code in "brand"; only use short, real-looking brand names.
    const b = String(brand || "").trim();

      f.classList.add("flash"); setTimeout(function () { f.classList.remove("flash"); }, 1600);
    });
  }


  // ---------- 5. the guided tour: Penny shows each part, the child does it ----------
  var TOUR = [
    { find: function () { return aq("#goPrice"); }, title: "Launch WorthIt", text: "Everything starts here. Tap <b>Launch WorthIt</b>.", tap: true },
    { find: function () { return dev.querySelector(".launch") ? null : aq("#grid"); }, match: ".pcard", title: "Go shopping", text: "This is a pretend shop. <b>Tap any toy</b> you like.", tap: true },
    { find: function () { var e = aq(".prices.found"); return e && aq(".scan.gone") ? e : null; }, title: "I read the screen", text: "WorthIt reads the <b>name and price</b> right off the page. No typing needed!", onNext: function () { var sc = dev.querySelector(".scr:not(.leaving)"); if (sc && sc._openSheet) sc._openSheet(); } },
    { find: function () { return pq(".days") || null; }, title: "The price, in days", text: "Here it is in <b>days of your allowance</b>. A big number means: think it over!" },
    { find: function () { return pq('[data-act="wish"]'); }, title: "Not sure? Wait.", text: "Tap <b>Save to my wish list</b>. It waits a few days, then you decide with a grown-up.", tap: true },
    { find: function () { return pq('[data-tab="learn"]'); }, title: "Learn", text: "<b>Learn</b> shows what else this money could be. Tap it.", tap: true },
    { find: function () { return pq('[data-tab="better"]'); }, title: "Better buy", text: "<b>Better buy</b> finds the same thing cheaper, or secondhand to help the planet. Tap it.", tap: true },
    { find: function () { return pq('[data-area="me"]'); }, title: "Your space", text: "Your <b>wish list, money lessons and badges</b> live here. Tap it.", tap: true },
    { find: function () { return pq('[data-tab="lessons"]'); }, title: "Money lessons", text: "8 short lessons, one question each. Finish them to rise from Coin Starter to <b>Money Master</b>." },
    { final: true, title: "Your turn!", text: "That's WorthIt. Now explore on your own. Stuck? <b>Tap my face</b> in the bottom-left corner any time. On a computer, hover over anything and I'll whisper what it does." }
  ];
  var tour = null;
  function startTour() {
    if (tour) return;
    closePenny(true);
    if (!dev.querySelector('.scr:not(.leaving)[data-name="home"]')) home();
    tour = { i: 0, el: h("div", "coach"), raf: 0 };
    var mask = h("div", "coach-mask"), ring = h("div", "coach-ring"), card = h("div", "coach-card");
    tour.el.append(mask, ring, card);
    tour.mask = mask; tour.ring = ring; tour.card = card;
    dev.append(tour.el);
    dev.classList.add("touring");
    document.addEventListener("click", onTourClick, true);
    showStep();
    loop();
  }
  function endTour(goHome) {
    if (!tour) return;
    cancelAnimationFrame(tour.raf);
    document.removeEventListener("click", onTourClick, true);
    tour.el.remove(); tour = null;
    dev.classList.remove("touring");
    dev.querySelectorAll(".ph").forEach(function (x) { x.classList.remove("touring"); });
    store.set({ toured: true });
    if (goHome) home(true);
  }
  function showStep() {
    var st = TOUR[tour.i];
    var c = tour.card;
    tour.el.classList.toggle("final", !!st.final);
    c.replaceChildren();
    c.style.animation = "none"; void c.offsetWidth; c.style.animation = "";
    if (st.final) {
      tour.ring.style.opacity = "0";
      tour.mask.style.clipPath = "none";
      var bp = h("div", "bigp"); bp.innerHTML = WorthItPenny.art("cheer");
      c.append(bp, h("span", "ti", st.title), html("p", null, st.text));
      var ft = h("div", "ft"); ft.style.justifyContent = "center";
      var go = h("button", "nx", "Start exploring"); go.type = "button"; go.addEventListener("click", function () { endTour(true); });
      ft.append(go); c.append(ft);
      c.style.top = "50%"; c.style.transform = "translateY(-50%)";
      return;
    }
    c.style.transform = "";
    var hd = h("div", "hd"), fc = h("div", "fc"); fc.innerHTML = WorthItPenny.art("happy", { face: true });
    hd.append(fc, h("span", "ti", st.title), h("span", "ct", (tour.i + 1) + " / " + (TOUR.length - 1)));
    var ft = h("div", "ft"), dots = h("div", "dots");
    for (var k = 0; k < TOUR.length - 1; k++) { var d = h("i"); if (k === tour.i) d.className = "on"; dots.append(d); }
    var sk = h("button", "sk", "Skip tour"); sk.type = "button"; sk.addEventListener("click", function () { endTour(true); });
    ft.append(dots, sk);
    if (st.tap) { var tp = h("span", "tap"); tp.append(h("i"), "Tap it"); ft.append(tp); }
    else { var nx = h("button", "nx", "Next"); nx.type = "button"; nx.addEventListener("click", function () { if (st.onNext) st.onNext(); nextStep(); }); ft.append(nx); }
    c.append(hd, html("p", null, st.text), ft);
    tour.target = null;
  }
  function nextStep() { if (!tour) return; tour.i++; if (tour.i >= TOUR.length) return endTour(); showStep(); }
  function onTourClick(e) {
    if (!tour) return;
    var st = TOUR[tour.i];
    if (!st.tap || !tour.target) return;
    var path = e.composedPath();
    var hit = st.match ? path.some(function (n) { return n.matches && n.matches(st.match); }) : path.indexOf(tour.target) >= 0;
    if (hit) setTimeout(nextStep, 120);
  }
  function loop() {
    if (!tour) return;
    dev.querySelectorAll(".ph").forEach(function (x) { x.classList.add("touring"); });
    var st = TOUR[tour.i];
    if (!st.final) {
      var el = st.find();
      var d = dev.getBoundingClientRect(), W2 = d.width, H2 = d.height;
      var showIt = !!(el && el.getClientRects().length);
      tour.mask.style.opacity = showIt ? "1" : "0"; tour.card.style.opacity = showIt ? "1" : "0"; tour.card.style.pointerEvents = showIt ? "auto" : "none";
      if (showIt) {
        tour.target = el;
        var r = el.getBoundingClientRect(), pad = 6;
        var x = Math.max(4, r.left - d.left - pad), y = Math.max(4, r.top - d.top - pad), w = Math.min(W2 - x - 4, r.width + pad * 2), hh = Math.min(H2 - y - 4, r.height + pad * 2);
        // a dark veil with a window cut out where the child should look (and tap)
        tour.mask.style.clipPath = "path(evenodd, 'M0 0 H" + W2 + " V" + H2 + " H0 Z M" + x + " " + y + " h" + w + " v" + hh + " h" + (-w) + " Z')";
        var rs = tour.ring.style; rs.opacity = "1"; rs.left = x + "px"; rs.top = y + "px"; rs.width = w + "px"; rs.height = hh + "px";
        var ch = tour.card.offsetHeight || 150;
        var below = y + hh + 14, above = y - ch - 14;
        tour.card.style.top = (below + ch < H2 - 10 ? below : Math.max(12, above)) + "px";
      } else {
        tour.target = null;
        tour.mask.style.clipPath = "none";
        tour.ring.style.opacity = "0";
        tour.card.style.top = "auto";
        tour.card.style.bottom = "24px";
      }
      if (el) tour.card.style.bottom = "auto";
    }
    tour.raf = requestAnimationFrame(loop);
  }

  // ---------- 6. hover hints: Penny whispers what things do ----------
  var PANEL_HINTS = [
    ['[data-tab="cost"]', "Cost: the price in days of your allowance."], ['[data-tab="learn"]', "Learn: what else this money could be."],
    ['[data-tab="better"]', "Better buy: the same thing cheaper, or secondhand."], ['[data-tab="wish"]', "Your wish list: things you're thinking over."],
    ['[data-tab="lessons"]', "8 short money lessons."], ['[data-tab="badges"]', "Badges you earn for thinking, waiting and learning."],
    ['[data-act="wish"]', "Save it, wait a few days, then decide with a grown-up."], ['[data-area="item"]', "This item: Cost, Learn and Better buy."],
    ['[data-area="me"]', "Your wish list, lessons and badges."], [".days", "The price in days of your allowance."], [".penny-help", "Ask Penny about this screen."],
    ['[data-act="yes"]', "Still want it after waiting? Show a grown-up."], ['[data-act="no"]', "Changed your mind? That's a smart choice too."]
  ];
  var hintEl = null, hintFor = null;
  var canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
  function hideHint() { if (hintEl) hintEl.classList.remove("on"); hintFor = null; }
  function showHint(el, text) {
    if (!hintEl) { hintEl = h("div", "hint"); hintEl.setAttribute("role", "tooltip"); }
    if (!hintEl.isConnected) dev.append(hintEl);
    hintEl.innerHTML = '<span class="fc">' + WorthItPenny.art("happy", { face: true }) + "</span><span></span>";
    hintEl.lastChild.textContent = text;
    var r = el.getBoundingClientRect(), d = dev.getBoundingClientRect();
    hintEl.style.left = "0px"; hintEl.style.top = "0px"; hintEl.classList.remove("on");
    var hw = hintEl.offsetWidth, hh = hintEl.offsetHeight;
    var x = Math.min(Math.max(10, r.left - d.left + r.width / 2 - hw / 2), d.width - hw - 10);
    var y = r.top - d.top - hh - 10; if (y < 10) y = r.bottom - d.top + 10;
    hintEl.style.left = x + "px"; hintEl.style.top = y + "px";
    requestAnimationFrame(function () { if (hintEl) hintEl.classList.add("on"); });
  }
  document.addEventListener("pointerdown", function () { clearTimeout(showHint._t); hideHint(); }, true);
  if (canHover) {
    document.addEventListener("mouseover", function (e) {
      if (tour || pennyLayer) return;
      var path = e.composedPath(), found = null, text = null;
      for (var k = 0; k < path.length && !found; k++) {
        var n = path[k];
        if (!n.matches) continue;
        if (n.dataset && n.dataset.hint) { found = n; text = n.dataset.hint; break; }
        for (var j = 0; j < PANEL_HINTS.length; j++) if (n.matches(PANEL_HINTS[j][0])) { found = n; text = PANEL_HINTS[j][1]; break; }
        if (n === dev) break;
      }
      if (!found) { hideHint(); return; }
      if (found === hintFor) return;
      hintFor = found;
      clearTimeout(showHint._t);
      showHint._t = setTimeout(function () { if (hintFor === found) showHint(found, text); }, 380);
    });
  }

  // ---------- the entrance ----------
  var dust = document.getElementById("dust");
  for (var i = 0; i < 26; i++) { var d = document.createElement("i"); d.style.cssText = "left:" + (4 + (i * 53) % 92) + "%;top:" + (6 + (i * 37) % 88) + "%;--t:" + (3 + i % 4) + "s;--d:" + (i % 7) * .5 + "s"; dust.append(d); }
  var intro = document.getElementById("intro"), app = document.getElementById("app");
  document.getElementById("enter").addEventListener("click", function () {
    intro.classList.add("leave");
    app.hidden = false;
    if (!mem.loggedIn) auth(mem.account ? "login" : "signup");
    else if (!mem.planChosen) plan();
    else if (!mem.onboarded || mem.onboardedFor !== (mem.account && mem.account.email)) setup();
    else { home(); if (!mem.toured) setTimeout(startTour, REDUCE ? 200 : 1200); }
    setTimeout(function () { intro.remove(); }, REDUCE ? 0 : 800);
  });
  setTimeout(function () { try { document.getElementById("enter").focus({ preventScroll: true }); } catch (e) {} }, 1000);
})();
</script>

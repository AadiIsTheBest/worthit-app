<style>
  :root { color-scheme: light; }

  .note { background: #FFF6DF; color: #6B4E12; font-size: 13px; padding: 8px 24px; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }
  .shot { background: #F3F1EC; border-radius: 20px; aspect-ratio: 10 / 8; } .shot svg { width: 100%; height: 100%; display: block; }
  .crumb { font-size: 13px; color: #6B6B72; margin: 0 0 8px; }
  h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.2; }
  .stars { color: #B8860B; font-size: 14px; margin: 0 0 14px; }
  .price { font-size: 34px; font-weight: 800; } .old { color: #9A9AA2; text-decoration: line-through; margin-left: 10px; }
  .desc { color: #44444C; line-height: 1.6; }
  .buy { display: flex; gap: 10px; margin-top: 18px; } .buy button { flex: 1; border: 0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; cursor: not-allowed; }
  .cart { background: #1D1D22; color: #fff; } .now { background: #D9402B; color: #fff; }
  .more { max-width: 1040px; margin: 0 auto; padding: 0 16px 60px; }
  .more h2 { font-size: 18px; } .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .row a { display: block; background: #fff; border: 1px solid #E8E6E0; border-radius: 14px; padding: 10px; color: inherit; text-decoration: none; font-size: 13px; }
  .row a svg { width: 100%; height: auto; background: #F3F1EC; border-radius: 10px; display: block; margin-bottom: 6px; } .row b { color: #D9402B; display: block; }
</style>
</head>

  document.title = p.name + " · toyshop";
  var ld = document.createElement("script"); ld.type = "application/ld+json";
  ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "Product", name: p.name, description: p.desc, offers: { "@type": "Offer", price: p.price.toFixed(2), priceCurrency: "SGD", availability: "https://schema.org/InStock" } });
